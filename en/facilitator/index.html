t in the next sessions of The Journey?"]}]}, {"n": 3, "title": "Discover Your Giftedness", "sub": "Your gifts, and where they fit", "sab": "Third Sabbath", "icon": "gift", "blocks": [{"t": "note", "k": "ask", "x": "Recap: What are you made for? What is our mission statement? What is the definition of a disciple?"}, {"t": "note", "k": "say", "x": "Reminder: we want fully empowered disciples walking in their giftedness."}, {"t": "h", "x": "Part 1: Recap"}, {"t": "t", "x": "We want fully empowered disciples walking in their giftedness."}, {"t": "h", "x": "Part 2: Welcome to Level 3"}, {"t": "t", "x": "Today's goal: review your spiritual gift inventory and explore how it applies."}, {"t": "s", "ref": "Romans 12:4-6", "v": "4 Just as each of us has one body with many members, and not all members have the same function, 5 so in Christ we who are many are one body, and each member belongs to one another. 6 We have different gifts according to the grace given us. If one\u2019s gift is prophecy, let him use it in proportion to his faith;"}, {"t": "t", "x": "Each person is unique and irreplaceable in the Body of Christ. Our gifts are given by grace, for the benefit of the Body."}, {"t": "s", "ref": "1 Peter 4:10", "v": "As good stewards of the manifold grace of God, each of you should use whatever gift he has received to serve one another."}, {"t": "h", "x": "Part 4: Spiritual Gift Review"}, {"t": "mygifts"}, {"t": "note", "k": "ask", "x": "What did you think about the assessment? Take a few moments to get a feel for each person's experience."}, {"t": "note", "k": "do", "x": "Invite each person to share their top three gifts. Read each definition aloud. Ask: \"What do you think about this gift?\" \"Where have you seen it in your life?\" \"How do you see these gifts complementing each other?\""}, {"t": "giftlist"}, {"t": "s", "ref": "1 Corinthians 12:4-27", "v": "4 There are different gifts, but the same Spirit. 5 There are different ministries, but the same Lord. 6 There are different ways of working, but the same God works all things in all people. 7 Now to each one the manifestation of the Spirit is given for the common good. 8 To one there is given through the Spirit the message of wisdom, to another the message of knowledge by the same Spirit, 9 to another faith by the same Spirit, to another gifts of healing by that one Spirit, 10 to another the working of miracles, to another prophecy, to another distinguishing between spirits, to another speaking in various tongues, and to still another the interpretation of tongues. 11 All these are the work of one and the same Spirit, who apportions them to each one as He determines. 12 The body is a unit, though it is composed of many parts. And although its parts are many, they all form one body. So it is with Christ. 13 For in one Spirit we were all baptized into one body, whether Jews or Greeks, slave or free, and we were all given one Spirit to drink. 14 For the body does not consist of one part, but of many. 15 If the foot should say, \u201cBecause I am not a hand, I do not belong to the body,\u201d that would not make it any less a part of the body. 16 And if the ear should say, \u201cBecause I am not an eye, I do not belong to the body,\u201d that would not make it any less a part of the body. 17 If the whole body were an eye, where would the sense of hearing be? If the whole body were an ear, where would the sense of smell be? 18 But in fact, God has arranged the members of the body, every one of them, according to His design. 19 If they were all one part, where would the body be? 20 As it is, there are many parts, but one body. 21 The eye cannot say to the hand, \u201cI do not need you.\u201d Nor can the head say to the feet, \u201cI do not need you.\u201d 22 On the contrary, the parts of the body that seem to be weaker are indispensable, 23 and the parts we consider less honorable, we treat with greater honor. And our unpresentable parts are treated with special modesty, 24 whereas our presentable parts have no such need. But God has composed the body and has given greater honor to the parts that lacked it, 25 so that there should be no division in the body, but that its members should have mutual concern for one another. 26 If one part suffers, every part suffers with it; if one part is honored, every part rejoices with it. 27 Now you are the body of Christ, and each of you is a member of it."}, {"t": "h", "x": "Part 5: My Jesus Story"}, {"t": "note", "k": "say", "x": "Storytelling is a big part of ARISE Miami. No one can refute your story and it is a great evangelism tool. Let us share our stories together."}, {"t": "note", "k": "do", "x": "Break into groups of three. Avoid placing spouses together. Each person shares for five minutes. Reinforce: your story is powerful and cannot be refuted."}, {"t": "t", "x": "Storytelling is a big part of ARISE Miami. No one can refute your story, and it is a powerful evangelism tool."}, {"t": "reflect", "x": "What was your life like before Jesus?"}, {"t": "reflect", "x": "How did you come to know Jesus?"}, {"t": "reflect", "x": "What is your life like since then?"}, {"t": "h", "x": "Part 6: ARISE's Story"}, {"t": "note", "k": "ask", "x": "Share the different initiatives at ARISE and ask where they have been inspired to join."}, {"t": "t", "x": "ARISE came from a merger of two churches a generation apart \u2014 New Community and Ignite Fellowship \u2014 committed to staying effective in a changing world."}, {"t": "t", "x": "Core values: Jesus and His Word. Acceptance. Innovation. Service. Reaching the Next Generation. Making Disciple Makers."}, {"t": "t", "x": "Motto: Whatever It Takes. As long as it's not illegal, immoral or fattening, we'll try it."}, {"t": "h", "x": "Part 7: Recap"}, {"t": "t", "x": "Your story, Jesus' story and ARISE's story are intersecting now. You have an irreplaceable and unique calling."}, {"t": "feedback", "q": ["What did you find most interesting about Level 3 of The Journey?", "What are you most looking forward to learning about in the next sessions of The Journey?"]}]}, {"n": 4, "title": "Discover Your Impact", "sub": "Family, church, city", "sab": "Fourth Sabbath", "icon": "target", "blocks": [{"t": "note", "k": "do", "x": "Greet the group and introduce yourself."}, {"t": "note", "k": "ask", "x": "Recap Level 1: What is the mission God has uniquely called us to? How do we define a disciple?"}, {"t": "note", "k": "ask", "x": "Recap Level 2: What takeaways do you have from living a committed, engaged life? What inspired and challenged you the most?"}, {"t": "note", "k": "ask", "x": "Recap Level 3: What helped you most in discovering your spiritual gifts? What surprised you about your story? How might God use it to reach others?"}, {"t": "h", "x": "Part 1: Church on Mission"}, {"t": "t", "x": "Recap: what is the mission God has uniquely called us to? How do we define a disciple? What did you discover about your gifts?"}, {"t": "h", "x": "Part 2: Fully Engaged at ARISE Miami"}, {"t": "note", "k": "say", "x": "These are on-ramps for growing in relationship with God and people while maturing as disciples of Jesus."}, {"t": "t", "x": "Worship corporately \u2014 Sabbath gathering, church-wide events, mid-size gatherings."}, {"t": "t", "x": "Connect deeply \u2014 The Journey, baptism, Life Groups, Base Camp."}, {"t": "t", "x": "Give committedly \u2014 time, talent, treasure."}, {"t": "t", "x": "Minister selflessly \u2014 serving on a ministry team."}, {"t": "t", "x": "Serve Miami \u2014 the local church, missions and non-profits, individuals in need."}, {"t": "t", "x": "These are on-ramps for growing in relationship with God and people while maturing as disciples of Jesus."}, {"t": "h", "x": "Part 3: ARISE Miami Covenant Partnership"}, {"t": "note", "k": "do", "x": "Read the covenant aloud together. Give people time to actually read it before signing \u2014 this is a commitment, not a form."}, {"t": "covenant"}, {"t": "h", "x": "Part 4: Next Steps"}, {"t": "note", "k": "do", "x": "Walk them through choosing a ministry in the app. Remind them their gifts are a guide, not a limit. Anyone unsure should still choose \"not sure yet\" so Next Steps can follow up."}, {"t": "t", "x": "Membership at ARISE Miami is not about adding your name to a list \u2014 it is about connecting with the people and the vision of the church."}, {"t": "ministry"}, {"t": "feedback", "q": ["What did you find most interesting about Level 4 of The Journey?"]}]}], "GIFTS": [["evangelism", "Evangelism", "A special ability and enthusiasm for communicating the good news of salvation in Christ to those who are not yet believers.", "Acts 8:4-8"], ["prophecy", "Prophecy", "The special ability to receive and communicate a timely message from God to an individual or group.", "Acts 27:21-26"], ["teaching", "Teaching / Preaching", "The ability to understand spiritual truths and to explain them clearly to others.", "Acts 20:20"], ["exhortation", "Exhortation / Encouragement", "Offering comfort, consolation or encouragement to those who are discouraged, confused or wavering in their faith.", "Acts 11:22-24"], ["shepherding", "Shepherding", "A God-given ability to care for the spiritual needs of believers and to lead and nurture them to grow in their faith.", "1 Peter 5:1-4"], ["serving", "Serving / Helps", "Bringing spiritual value to the accomplishment of tasks, working alongside others and freeing them to use their own gifts.", "Acts 9:36"], ["mercy_showing", "Mercy-Showing", "Empathy and compassion for people in pain, with a strong desire to minister to them and alleviate their suffering.", "Acts 16:33"], ["giving", "Giving / Generosity", "A God-given love for sharing whatever resources one has, much or little, for the benefit of the Body of Christ.", "Luke 21:1-4"], ["administration", "Administration", "Understanding immediate and long-range goals and organizing people, information and materials to accomplish them.", "Acts 6:2-7"]], "MIN": [["Next Steps", "Helping people take their next step and find where they belong.", ["Welcoming first-time guests", "Follow-up and connection", "Missions and outreach", "Community service"], ["evangelism", "exhortation", "shepherding"]], ["Hospitality", "Making everyone who walks in feel welcomed and cared for.", ["Greeting and ushering", "Food and refreshments", "Event setup"], ["shepherding", "mercy_showing", "giving"]], ["Worship", "Leading the church into God's presence through music.", ["Vocals", "Instruments", "Worship planning"], ["exhortation", "serving", "mercy_showing"]], ["Student Ministry", "Walking with students and young adults as they follow Jesus.", ["Students", "Young adults", "Mentoring"], ["evangelism", "teaching", "exhortation"]], ["Children's Ministry / Seekers", "Introducing children to Jesus and caring for them well.", ["Teaching a class", "Check-in and child safety", "Crafts and activities"], ["teaching", "serving", "giving"]], ["Life Groups", "Life-on-life discipleship in homes, and the gatherings that bring us together.", ["Hosting a group", "Co-leading a group", "Gatherings and events", "Life-on-life discipleship"], ["evangelism", "prophecy", "shepherding"]], ["Production", "Running the service \u2014 sound, video and lighting.", ["Sound", "Video and livestream", "Lighting", "Slides"], ["prophecy", "serving", "administration"]], ["Creative and Social", "Design and social media \u2014 how ARISE looks and sounds online.", ["Graphic design", "Photo and video content", "Social media"], ["prophecy", "teaching", "administration"]], ["Behind the Scenes", "Resources, administration and facilities \u2014 the work that holds everything up.", ["Facilities and maintenance", "Office and administration", "Resources and supplies"], ["mercy_showing", "giving", "administration"]]], "COV": [["1. Protect the Unity of My Church by", ["Acting in love toward others", "Refusing to gossip", "Supporting leadership", "Resolving conflicts biblically"], ["Romans 14:19", "Ephesians 4:29", "Hebrews 13:17"]], ["2. Share the Responsibility of My Church by", ["Praying for growth and health", "Inviting others to attend", "Warmly welcoming guests"], ["1 Thessalonians 1:1-2", "Luke 14:23", "Romans 15:7"]], ["3. Serve the Ministry of My Church by", ["Discovering my gifts and talents", "Using them to serve others", "Developing a servant's heart"], ["1 Peter 4:10", "Ephesians 4:11-12", "Philippians 2:4-5"]], ["4. Support the Testimony of My Church by", ["Faithfully attending church and groups", "Living a godly life", "Giving regularly"], ["Acts 2:42", "Hebrews 10:25", "Philippians 1:27"]]], "P": {"John 17:3": "Now this is eternal life, that they may know You, the only true God, and Jesus Christ, whom You have sent.", "Genesis 2:18": "The LORD God also said, \u201cIt is not good for the man to be alone. I will make for him a suitable helper.\u201d", "Romans 3:23": "for all have sinned and fall short of the glory of God,", "Romans 6:23": "For the wages of sin is death, but the gift of God is eternal life in Christ Jesus our Lord.", "Titus 2:11-13": "11 For the grace of God has appeared, bringing salvation to everyone. 12 It instructs us to renounce ungodliness and worldly passions, and to live sensible, upright, and godly lives in the present age, 13 as we await the blessed hope and glorious appearance of our great God and Savior Jesus Christ.", "Romans 5:8": "But God proves His love for us in this: While we were still sinners, Christ died for us.", "Romans 10:9-13": "9 that if you confess with your mouth, \u201cJesus is Lord,\u201d and believe in your heart that God raised Him from the dead, you will be saved. 10 For with your heart you believe and are justified, and with your mouth you confess and are saved. 11 It is just as the Scripture says: \u201cAnyone who believes in Him will never be put to shame.\u201d 12 For there is no difference between Jew and Greek: The same Lord is Lord of all, and gives richly to all who call on Him, 13 for, \u201cEveryone who calls on the name of the Lord will be saved.\u201d", "Titus 2:12": "It instructs us to renounce ungodliness and worldly passions, and to live sensible, upright, and godly lives in the present age,", "Romans 8:1": "Therefore, there is now no condemnation for those who are in Christ Jesus.", "Matthew 28:18-20": "18 Then Jesus came to them and said, \u201cAll authority in heaven and on earth has been given to Me. 19 Therefore go and make disciples of all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Spirit, 20 and teaching them to obey all that I have commanded you. And surely I am with you always, even to the end of the age.\u201d", "Acts 2:37-38": "37 When the people heard this, they were cut to the heart and asked Peter and the other apostles, \u201cBrothers, what shall we do?\u201d 38 Peter replied, \u201cRepent and be baptized, every one of you, in the name of Jesus Christ for the forgiveness of your sins, and you will receive the gift of the Holy Spirit.", "Mark 8:27-31": "27 Then Jesus and His disciples went on to the villages around Caesarea Philippi. On the way, He questioned His disciples: \u201cWho do people say I am?\u201d 28 They replied, \u201cSome say John the Baptist; others say Elijah; and still others, one of the prophets.\u201d 29 \u201cBut what about you?\u201d Jesus asked. \u201cWho do you say I am?\u201d Peter answered, \u201cYou are the Christ.\u201d 30 And Jesus warned them not to tell anyone about Him. 31 Then He began to teach them that the Son of Man must suffer many things and be rejected by the elders, chief priests, and scribes, and that He must be killed and after three days rise again.", "Matthew 4:19": "\u201cCome, follow Me,\u201d Jesus said, \u201cand I will make you fishers of men.\u201d", "Acts 2:46-47": "46 With one accord they continued to meet daily in the temple courts and to break bread from house to house, sharing their meals with gladness and sincerity of heart, 47 praising God and enjoying the favor of all the people. And the Lord added to their number daily those who were being saved.", "1 John 3:16": "By this we know what love is: Jesus laid down His life for us, and we ought to lay down our lives for our brothers.", "Proverbs 27:17": "As iron sharpens iron, so one man sharpens another.", "Acts 5:42": "Every day, in the temple courts and from house to house, they did not stop teaching and proclaiming the good news that Jesus is the Christ.", "1 Corinthians 16:1-4": "1 Now about the collection for the saints, you are to do as I directed the churches of Galatia: 2 On the first day of every week, each of you should set aside a portion of his income, saving it up, so that when I come no collections will be needed. 3 Then, on my arrival, I will send letters with those you recommend to carry your gift to Jerusalem. 4 And if it is advisable for me to go also, they can travel with me.", "Deuteronomy 14:22-25": "22 You must be sure to set aside a tenth of all the produce brought forth each year from your fields. 23 And you are to eat a tenth of your grain, new wine, and oil, and the firstborn of your herds and flocks, in the presence of the LORD your God at the place He will choose as a dwelling for His Name, so that you may learn to fear the LORD your God always. 24 But if the distance is too great for you to carry that with which the LORD your God has blessed you, because the place where the LORD your God will choose to put His Name is too far away, 25 then exchange it for money, take the money in your hand, and go to the place the LORD your God will choose.", "Deuteronomy 14:28-29": "28 At the end of every three years, bring a tenth of all your produce for that year and lay it up within your gates. 29 Then the Levite (because he has no portion or inheritance among you), the foreigner, the fatherless, and the widow within your gates may come and eat and be satisfied. And the LORD your God will bless you in all the work of your hands.", "Malachi 3:10": "Bring the full tithe into the storehouse, so that there may be food in My house. Test Me in this,\u201d says the LORD of Hosts. \u201cSee if I will not open the windows of heaven and pour out for you blessing without measure.", "Proverbs 3:9-10": "9 Honor the LORD with your wealth and with the firstfruits of all your harvest; 10 then your barns will be filled with plenty, and your vats will overflow with new wine.", "1 Timothy 6:18-19": "18 Instruct them to do good, to be rich in good works, and to be generous and ready to share, 19 treasuring up for themselves a firm foundation for the future, so that they may take hold of that which is truly life.", "Romans 12:8": "if it is encouraging, let him encourage; if it is giving, let him give generously; if it is leading, let him lead with diligence; if it is showing mercy, let him do it cheerfully.", "Romans 12:4-6": "4 Just as each of us has one body with many members, and not all members have the same function, 5 so in Christ we who are many are one body, and each member belongs to one another. 6 We have different gifts according to the grace given us. If one\u2019s gift is prophecy, let him use it in proportion to his faith;", "1 Peter 4:10": "As good stewards of the manifold grace of God, each of you should use whatever gift he has received to serve one another.", "1 Corinthians 12:4-27": "4 There are different gifts, but the same Spirit. 5 There are different ministries, but the same Lord. 6 There are different ways of working, but the same God works all things in all people. 7 Now to each one the manifestation of the Spirit is given for the common good. 8 To one there is given through the Spirit the message of wisdom, to another the message of knowledge by the same Spirit, 9 to another faith by the same Spirit, to another gifts of healing by that one Spirit, 10 to another the working of miracles, to another prophecy, to another distinguishing between spirits, to another speaking in various tongues, and to still another the interpretation of tongues. 11 All these are the work of one and the same Spirit, who apportions them to each one as He determines. 12 The body is a unit, though it is composed of many parts. And although its parts are many, they all form one body. So it is with Christ. 13 For in one Spirit we were all baptized into one body, whether Jews or Greeks, slave or free, and we were all given one Spirit to drink. 14 For the body does not consist of one part, but of many. 15 If the foot should say, \u201cBecause I am not a hand, I do not belong to the body,\u201d that would not make it any less a part of the body. 16 And if the ear should say, \u201cBecause I am not an eye, I do not belong to the body,\u201d that would not make it any less a part of the body. 17 If the whole body were an eye, where would the sense of hearing be? If the whole body were an ear, where would the sense of smell be? 18 But in fact, God has arranged the members of the body, every one of them, according to His design. 19 If they were all one part, where would the body be? 20 As it is, there are many parts, but one body. 21 The eye cannot say to the hand, \u201cI do not need you.\u201d Nor can the head say to the feet, \u201cI do not need you.\u201d 22 On the contrary, the parts of the body that seem to be weaker are indispensable, 23 and the parts we consider less honorable, we treat with greater honor. And our unpresentable parts are treated with special modesty, 24 whereas our presentable parts have no such need. But God has composed the body and has given greater honor to the parts that lacked it, 25 so that there should be no division in the body, but that its members should have mutual concern for one another. 26 If one part suffers, every part suffers with it; if one part is honored, every part rejoices with it. 27 Now you are the body of Christ, and each of you is a member of it.", "Acts 6:2-7": "2 So the Twelve summoned all the disciples and said, \u201cIt is unacceptable for us to neglect the word of God in order to wait on tables. 3 Therefore, brothers, select from among you seven men confirmed to be full of the Spirit and wisdom. We will appoint this responsibility to them 4 and will devote ourselves to prayer and to the ministry of the word.\u201d 5 This proposal pleased the whole group. They chose Stephen, a man full of faith and of the Holy Spirit, as well as Philip, Prochorus, Nicanor, Timon, Parmenas, and Nicolas from Antioch, a convert to Judaism. 6 They presented these seven to the apostles, who prayed and laid their hands on them. 7 So the word of God continued to spread. The number of disciples in Jerusalem grew rapidly, and a great number of priests became obedient to the faith.", "Galatians 2:7-8": "7 On the contrary, they saw that I had been entrusted to preach the gospel to the uncircumcised, just as Peter had been to the circumcised. 8 For the One who was at work in Peter\u2019s apostleship to the circumcised was also at work in my apostleship to the Gentiles.", "Exodus 31:3-5": "3 And I have filled him with the Spirit of God, with skill, ability, and knowledge in all kinds of craftsmanship, 4 to design artistic works in gold, silver, and bronze, 5 to cut gemstones for settings, and to carve wood, so that he may be a master of every craft.", "Psalm 150:3-5": "3 Praise Him with the sound of the horn; praise Him with the harp and lyre. 4 Praise Him with tambourine and dancing; praise Him with strings and flute. 5 Praise Him with clashing cymbals; praise Him with resounding cymbals.", "Acts 5:1-11": "1 Now a man named Ananias, together with his wife Sapphira, also sold a piece of property. 2 With his wife\u2019s full knowledge, he kept back some of the proceeds for himself, but brought a portion and laid it at the apostles\u2019 feet. 3 Then Peter said, \u201cAnanias, how is it that Satan has filled your heart to lie to the Holy Spirit and withhold some of the proceeds from the land? 4 Did it not belong to you before it was sold? And after it was sold, was it not at your disposal? How could you conceive such a deed in your heart? You have not lied to men, but to God!\u201d 5 On hearing these words, Ananias fell down and died. And great fear came over all who heard what had happened. 6 Then the young men stepped forward, wrapped up his body, and carried him out and buried him. 7 About three hours later his wife also came in, unaware of what had happened. 8 \u201cTell me,\u201d said Peter, \u201cis this the price you and your husband got for the land?\u201d \u201cYes,\u201d she answered, \u201cthat is the price.\u201d 9 \u201cHow could you agree to test the Spirit of the Lord?\u201d Peter replied. \u201cLook, the feet of the men who buried your husband are at the door, and they will carry you out also.\u201d 10 At that instant she fell down at his feet and died. Then the young men came in and, finding her dead, carried her out and buried her beside her husband. 11 And great fear came over the whole church and all who heard about these events.", "Acts 11:22-24": "22 When news of this reached the ears of the church in Jerusalem, they sent Barnabas to Antioch. 23 When he arrived and saw the grace of God, he rejoiced and encouraged them all to abide in the Lord with all their hearts. 24 Barnabas was a good man, full of the Holy Spirit and faith, and a great number of people were brought to the Lord.", "Acts 8:4-8": "4 Those who had been scattered preached the word wherever they went. 5 Philip went down to a city in Samaria and proclaimed the Christ to them. 6 The crowds gave their undivided attention to Philip\u2019s message and to the signs they saw him perform. 7 With loud shrieks, unclean spirits came out of many who were possessed, and many of the paralyzed and lame were healed. 8 So there was great joy in that city.", "Hebrews 11:7": "By faith Noah, when warned about things not yet seen, in godly fear built an ark to save his family. By faith he condemned the world and became heir of the righteousness that comes by faith.", "Luke 12:1-4": "1 In the meantime, a crowd of many thousands had gathered, so that they were trampling one another. Jesus began to speak first to His disciples: \u201cBeware of the leaven of the Pharisees, which is hypocrisy. 2 There is nothing concealed that will not be disclosed, and nothing hidden that will not be made known. 3 What you have spoken in the dark will be heard in the daylight, and what you have whispered in the inner rooms will be proclaimed from the housetops. 4 I tell you, My friends, do not be afraid of those who kill the body and after that can do no more.", "Acts 9:36": "In Joppa there was a disciple named Tabitha (which is translated as Dorcas), who was always occupied with works of kindness and charity.", "Acts 16:14-15": "14 Among those listening was a woman named Lydia, a dealer in purple cloth from the city of Thyatira, who was a worshiper of God. The Lord opened her heart to respond to Paul\u2019s message. 15 And when she and her household had been baptized, she urged us, \u201cIf you consider me a believer in the Lord, come and stay at my house.\u201d And she persuaded us.", "James 5:17-18": "17 Elijah was a man just like us. He prayed earnestly that it would not rain, and it did not rain on the land for three and a half years. 18 Again he prayed, and the heavens gave rain, and the earth yielded its crops.", "Colossians 2:1-4": "1 For I want you to know how much I am struggling for you and for those at Laodicea, and for all who have not met me face to face, 2 that they may be encouraged in heart, knit together in love, and filled with the full riches of complete understanding, so that they may know the mystery of God, namely Christ, 3 in whom are hidden all the treasures of wisdom and knowledge. 4 I say this so that no one will deceive you by smooth rhetoric.", "Acts 16:33": "At that hour of the night, the jailer took them and washed their wounds. And without delay, he and all his household were baptized.", "Acts 27:21-26": "21 After the men had gone a long time without food, Paul stood up among them and said, \u201cMen, you should have followed my advice not to sail from Crete. Then you would have averted this disaster and loss. 22 But now I urge you to keep up your courage, because you will not experience any loss of life, but only of the ship. 23 For just last night an angel of God, whose I am and whom I serve, stood beside me 24 and said, \u2018Do not be afraid, Paul; you must stand before Caesar. And look, God has granted you the lives of all who sail with you.\u2019 25 So take courage, men, for I believe God that it will happen just as He told me. 26 However, we must run aground on some island.\u201d", "1 Peter 5:1-4": "1 As a fellow elder, a witness of Christ\u2019s sufferings, and a partaker of the glory to be revealed, I appeal to the elders among you: 2 Be shepherds of God\u2019s flock that is among you, watching over them not out of compulsion, but because it is God\u2019s will; not out of greed, but out of eagerness; 3 not lording it over those entrusted to you, but being examples to the flock. 4 And when the Chief Shepherd appears, you will receive the crown of glory that will never fade away.", "Acts 20:20": "I did not shrink back from declaring anything that was helpful to you as I taught you publicly and from house to house,", "2 Peter 3:15": "Consider also that our Lord\u2019s patience brings salvation, just as our beloved brother Paul also wrote you with the wisdom God gave him.", "Romans 14:19": "So then, let us pursue what leads to peace and to mutual edification.", "Ephesians 4:29": "Let no unwholesome talk come out of your mouths, but only what is helpful for building up the one in need and bringing grace to those who listen.", "Hebrews 13:17": "Obey your leaders and submit to them, for they watch over your souls as those who must give an account. To this end, allow them to lead with joy and not with grief, for that would be of no const L=DATA.L,GIFTS=DATA.GIFTS,MIN=DATA.MIN,COV=DATA.COV,P=DATA.P;
// Daily codes, per level — the participant app checks them with the same formula.
// Session code: works only on that level's Sabbath. Make-up code: opens and completes the level on any day.
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const satIndex=d=>d.getDay()===6?Math.ceil(d.getDate()/7):0;
function dcode(kind,n,d){let h=2166136261;
  for(const c of 'journey|'+kind+'|'+n+'|'+ymd(d||new Date())){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0;}
  return String(h%9000+1000);}
let cur=[1,2,3,4].includes(satIndex(new Date()))?satIndex(new Date()):1;   // opens on today's level on a Sabbath
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const KIND={say:'Say',ask:'Ask',do:'Do'};

function tabs(){
  document.getElementById('tabs').innerHTML=L.map(l=>
    `<button class="tab ${l.n===cur?'on':''}" data-n="${l.n}">Level ${l.n} &middot; ${esc(l.title)}</button>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{cur=+t.dataset.n;draw();window.scrollTo({top:0});});
}

function block(b){
  if(b.t==='note') return `<div class="note ${b.k}"><b>${KIND[b.k]}</b>${esc(b.x)}</div>`;
  if(b.t==='h') return `<div class="blk h">${esc(b.x)}</div>`;
  if(b.t==='t') return `<div class="blk t">${esc(b.x)}</div>`;
  if(b.t==='s') return `<div class="blk s"><div class="ref">${esc(b.ref)} &middot; BSB</div>
    <div class="vt">${esc(b.v)}</div></div>`;
  if(b.t==='f'){let k=-1;
    const x=esc(b.x).replace(/___/g,()=>{k++;
      const a=b.a[k][0].replace(/^./,c=>c.toUpperCase());
      return `<span class="fill">${esc(a)}</span>`;});
    return `<div class="blk"><div class="ans">${x}</div></div>`;}
  if(b.t==='baptism') return `<div class="box"><h3>Baptism invitation</h3>
    <p>In the app they choose one of three: <b>Yes, I want to be baptized</b> &middot;
    <b>I have questions</b> &middot; <b>Not yet</b>.</p>
    <p style="margin-top:8px">The first two notify Pastor Kendall the same day and go to the baptismal prep team.</p></div>`;
  if(b.t==='lifegroup_link') return `<div class="box"><h3>Choose your Life Group</h3>
    <p>The app shows a button here opening the Life Groups open for sign-up on Church Center:
    <b>arisemiami.churchcenter.com/groups/life-groups</b></p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">Give everyone a minute to browse and pick a group before moving on. Some groups are open sign-up; others send a request to the leader.</p>
    <!-- lghelp-note --><p style="margin-top:6px">Below the button is a checkbox: <b>&ldquo;I'd like help finding a Life Group.&rdquo;</b> Anyone who checks it is flagged for the team to follow up.</p></div>`;
  if(b.t==='giving_link') return `<div class="box"><h3>Give online</h3>
    <p>The app shows a button here opening Adventist Giving:
    <b>adventistgiving.org/donate/ANTBS4</b></p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">Point it out, but don't linger &mdash; the teaching is about trust, not the transaction.</p></div>`;
  if(b.t==='homework') return `<div class="box"><h3>Homework before Level 3</h3>
    <p>Spiritual Gifts Assessment at gifts.churchgrowth.org &mdash; 108 questions, about 25 minutes.
    Required before Level 3. They record their top three in the app.</p></div>`;
  if(b.t==='gifts') return `<div class="box"><h3>Recording their top three gifts</h3>
    <p>The app shows all nine gifts here. Each participant taps their top three survey results, in order.
    Level 3 stays locked until all three are recorded.</p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">Most will take the survey at home &mdash; remind them to come back to this screen and record their results before Level 3.</p></div>`;
  if(b.t==='welcome') return `<div class="box"><h3>Before Level 1: a quick welcome</h3><p>The first time someone opens a level, the app asks for their first and last name, email and mobile phone &mdash; about 20 seconds. They are never asked again on that phone.</p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">Give people a minute to do this before you start teaching.</p></div>`;
  if(b.t==='aboutyou') return `<div class="box"><h3>Help us get to know you</h3><p>At the end of Level 1 the app asks for birthday, gender, marital status, home address and how they first heard about ARISE &mdash; the same details as the Level 1 form. They can&rsquo;t finish Level 1 without it.</p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">Only the ARISE team sees this.</p></div>`;
  if(b.t==='feedback') return `<div class="box"><h3>Before you finish</h3><p>The app asks:</p>
    <ul style="margin:8px 0 0 18px">${b.q.map(q=>`<li style="margin-bottom:4px">${esc(q)}</li>`).join('')}</ul>
    <p style="margin-top:8px;color:var(--muted);font-size:13px">Required to finish the level. Answers are sent to the ARISE team.</p></div>`;
  if(b.t==='mygifts') return `<div class="box"><h3>Their top three gifts</h3>
    <p>Each participant sees their own three here, with definitions and passages. Invite each person to share theirs aloud.</p></div>`;
  if(b.t==='giftlist') return `<div class="box"><h3>The nine gifts &mdash; read aloud as needed</h3>
    ${GIFTS.map(g=>`<div class="gitem"><b>${esc(g[1])}</b><p>${esc(g[2])}</p>
      <div class="r">${esc(g[3])}</div><div class="gscrip">${esc(P[g[3]]||'')}</div></div>`).join('')}</div>`;
  if(b.t==='reflect') return `<div class="box"><h3>Reflection prompt</h3><p><b>${esc(b.x)}</b></p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">Written privately in the app. No right answer.</p></div>`;
  if(b.t==='covenant') return `<div class="box"><h3>ARISE Miami Covenant Partnership</h3>
    <p>Having received Jesus Christ as Lord and Savior, having been baptized, and in agreement with ARISE's mission, I commit to:</p>
    ${COV.map(c=>`<div class="cvsec"><b>${esc(c[0])}</b><ul>${c[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      <div class="rf">${c[2].map(esc).join(' &middot; ')}</div></div>`).join('')}
    <p style="margin-top:12px"><b>They sign in the app.</b> Signatures are permanent and dated.</p></div>`;
  if(b.t==='ministry') return `<div class="box"><h3>Choosing a ministry</h3>
    <p>The app recommends three teams based on their gifts, then shows all nine. Every team is open to everyone.</p>
    <div class="chiplist">${MIN.map(m=>`<span class="chip">${esc(m[0])}</span>`).join('')}</div>
    <p style="margin-top:11px">Each has specific roles underneath. Anyone unsure should still pick
    <b>"not sure yet"</b> so Next Steps follows up rather than losing them.</p></div>`;
  return '';
}

function draw(){
  const l=L[cur-1];
  document.getElementById('catt').textContent=dcode('att',l.n);
  document.getElementById('cmk').textContent=dcode('makeup',l.n);
  document.getElementById('ckl').textContent='Level '+l.n+' session code';
  document.getElementById('ttl').textContent='Level '+l.n+' — '+l.title;
  const nb=l.blocks.filter(b=>b.t==='f').reduce((a,b)=>a+b.a.length,0);
  document.getElementById('body').innerHTML=`
   <div class="lh"><div class="lv">Level ${l.n} &middot; ${esc(l.sab)}</div>
    <h2>${esc(l.title)}</h2><p>${esc(l.sub)}</p>
    <div class="meta"><span><b>9:00 AM</b> start</span><span><b>90</b> minutes</span>
    ${nb?`<span><b>${nb}</b> blanks</span>`:''}
    <span>Session code <b>${dcode('att',l.n)}</b>${satIndex(new Date())===l.n?' (today)':' (works only on the '+esc(l.sab)+')'}</span>
    <span>Make-up code <b>${dcode('makeup',l.n)}</b> (today, any time)</span></div></div>
   ${l.blocks.map(block).join('')}`;
  tabs();
}
draw();
</script></body></html>
