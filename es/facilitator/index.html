<script>
const DATA={"L": [{"n": 1, "title": "Descubre tu propósito", "sub": "El porqué y el qué del cristianismo bíblico", "sab": "Primer sábado", "icon": "heart", "blocks": [{"t": "welcome"}, {"t": "note", "k": "do", "x": "Da la bienvenida con calidez. Preséntate y habla brevemente de tu familia."}, {"t": "note", "k": "ask", "x": "Rompehielos: \"Si pudieras escribir un libro, ¿cómo se llamaría?\""}, {"t": "note", "k": "say", "x": "Presenta los cuatro niveles y luego di: \"Esperamos que descubras más sobre ARISE y sobre cómo Dios está obrando en tu vida a través de este Camino.\""}, {"t": "h", "x": "Parte 1: ¿Para qué fuiste creado?"}, {"t": "s", "ref": "Juan 17:3", "v": "Esta empero es la vida eterna: que te conozcan el solo Dios verdadero, y á Jesucristo, al cual has enviado."}, {"t": "s", "ref": "Génesis 2:18", "v": "Y dijo Jehová Dios: No es bueno que el hombre esté solo; haréle ayuda idónea para él."}, {"t": "f", "x": "Fuiste creado para vivir en relación — con ___ y con ___.", "a": [["dios"], ["personas", "la gente", "gente"]]}, {"t": "h", "x": "Parte 2: ¿Cuál es el problema?"}, {"t": "note", "k": "say", "x": "Transición: ¿De qué se trata la vida ahora, después de la caída? ¿Qué está haciendo Dios? ¿Qué hago yo? ¿Qué hace la iglesia?"}, {"t": "s", "ref": "Romanos 3:23", "v": "Por cuanto todos pecaron, y están destituídos de la gloria de Dios;"}, {"t": "s", "ref": "Romanos 6:23", "v": "Porque la paga del pecado es muerte: mas la dádiva de Dios es vida eterna en Cristo Jesús Señor nuestro."}, {"t": "f", "x": "El pecado quebró nuestra relación con ___, con ___ mismos y con ___.", "a": [["dios"], ["nosotros"], ["los demás", "los otros", "otros", "demás"]]}, {"t": "f", "x": "La vida se trata de ___ la relación con Dios y con las personas, y de crecer en madurez.", "a": [["restaurar"]]}, {"t": "h", "x": "¿Qué es la madurez espiritual?"}, {"t": "note", "k": "say", "x": "Repasa Romanos 6:23 — todos pecaron, la paga del pecado, la dádiva de Dios."}, {"t": "t", "x": "La madurez espiritual no es lo que sabes, sino lo que haces con lo que sabes."}, {"t": "h", "x": "Romanos 6:23 — tres términos"}, {"t": "note", "k": "do", "x": "Define cada término con claridad antes de avanzar. Luego pregunta: \"¿Cómo sabemos cuándo hemos alcanzado la madurez espiritual?\""}, {"t": "f", "x": "La ___ es lo que merecemos.", "a": [["paga", "pago", "salario"]]}, {"t": "f", "x": "La ___ es gracia inmerecida: algo que no mereces, y que se te da.", "a": [["dádiva", "dadiva", "regalo", "don"]]}, {"t": "f", "x": "El ___ es una declaración legal de culpable o no culpable.", "a": [["veredicto"]]}, {"t": "h", "x": "Parte 3: la parte de Dios y mi parte"}, {"t": "s", "ref": "Tito 2:11-13", "v": "11 Porque la gracia de Dios que trae salvación á todos los hombres, se manifestó, 12 Enseñándonos que, renunciando á la impiedad y á los deseos mundanos, vivamos en este siglo templada, y justa, y píamente, 13 Esperando aquella esperanza bienaventurada, y la manifestación gloriosa del gran Dios y Salvador nuestro Jesucristo,"}, {"t": "t", "x": "La gracia va delante. Jesús toma la iniciativa y hace su parte primero."}, {"t": "s", "ref": "Romanos 5:8", "v": "Mas Dios encarece su caridad para con nosotros, porque siendo aún pecadores, Cristo murió por nosotros."}, {"t": "t", "x": "La justificación es el acto por el cual Dios traslada a una persona dispuesta del estado de pecado al estado de gracia."}, {"t": "f", "x": "Nuestra parte es ___, invocar el nombre del Señor.", "a": [["creer"]]}, {"t": "s", "ref": "Romanos 10:9-13", "v": "9 Que si confesares con tu boca al Señor Jesús, y creyeres en tu corazón que Dios le levantó de los muertos, serás salvo. 10 Porque con el corazón se cree para justicia; mas con la boca se hace confesión para salud. 11 Porque la Escritura dice: Todo aquel que en él creyere, no será avergonzado. 12 Porque no hay diferencia de Judío y de Griego: porque el mismo que es Señor de todos, rico es para con todos los que le invocan: 13 Porque todo aquel que invocare el nombre del Señor, será salvo."}, {"t": "t", "x": "Nota: este no es un proceso perfectamente lineal — hay subidas, bajadas, avances y retrocesos."}, {"t": "h", "x": "Seguir a Jesús"}, {"t": "s", "ref": "Tito 2:12", "v": "Enseñándonos que, renunciando á la impiedad y á los deseos mundanos, vivamos en este siglo templada, y justa, y píamente,"}, {"t": "t", "x": "Ya no tenemos un problema de pecado — estamos aprendiendo a vivir en justicia."}, {"t": "s", "ref": "Romanos 8:1", "v": "AHORA pues, ninguna condenación hay para los que están en Cristo Jesús, los que no andan conforme á la carne, mas conforme al espíritu."}, {"t": "t", "x": "La santificación es la acción o el proceso de ser librado del pecado y purificado."}, {"t": "h", "x": "Parte 4: justificación y santificación"}, {"t": "note", "k": "do", "x": "Comparte una historia personal de cómo la justificación y la santificación se han visto en tu vida. Que sea sencilla y honesta."}, {"t": "t", "x": "La justificación libra a las personas de la pena del pecado; la santificación las libra del poder del pecado."}, {"t": "t", "x": "La justificación es algo que Dios hace por nosotros; la santificación es lo que Dios hace con nosotros."}, {"t": "t", "x": "La justificación ocurre al instante, en el momento del nuevo nacimiento; la santificación ocurre gradualmente, a lo largo de toda la vida."}, {"t": "h", "x": "Parte 5: el siguiente paso — el bautismo"}, {"t": "note", "k": "say", "x": "¿Cuál es nuestro siguiente paso, habiendo entendido, creído y aceptado esta verdad tan hermosa? El bautismo."}, {"t": "t", "x": "El bautismo es una señal externa de un cambio interno — la expresión visible de una realidad invisible."}, {"t": "t", "x": "La palabra griega baptidzo significa sumergir. El bautismo bíblico es por inmersión."}, {"t": "s", "ref": "Mateo 28:18-20", "v": "18 Y llegando Jesús, les habló, diciendo: Toda potestad me es dada en el cielo y en la tierra. 19 Por tanto, id, y doctrinad á todos los Gentiles, bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo: 20 Enseñándoles que guarden todas las cosas que os he mandado: y he aquí, yo estoy con vosotros todos los días, hasta el fin del mundo. Amén."}, {"t": "s", "ref": "Hechos 2:37-38", "v": "37 Entonces oído esto, fueron compungidos de corazón, y dijeron á Pedro y á los otros apóstoles: Varones hermanos, ¿qué haremos? 38 Y Pedro les dice: Arrepentíos, y bautícese cada uno de vosotros en el nombre de Jesucristo para perdón de los pecados; y recibiréis el don del Espíritu Santo."}, {"t": "t", "x": "¿Quién puede bautizarse? Cualquiera que cree y acepta el Evangelio."}, {"t": "h", "x": "Parte 6: el Evangelio — 4 declaraciones"}, {"t": "f", "x": "El Reino de Dios ya está ___.", "a": [["aquí", "aqui"]]}, {"t": "f", "x": "Jesús es el ___, el ___ del mundo.", "a": [["cristo"], ["salvador"]]}, {"t": "f", "x": "Jesús ___ por nuestros pecados.", "a": [["murió", "murio"]]}, {"t": "f", "x": "Jesús ___ al tercer día.", "a": [["resucitó", "resucito"]]}, {"t": "h", "x": "3 respuestas clave"}, {"t": "f", "x": "___, ___ y ___.", "a": [["arrepentirse", "arrepiéntete", "arrepientete"], ["creer", "cree"], ["seguir", "sigue"]]}, {"t": "s", "ref": "Marcos 8:27-31", "v": "27 Y salió Jesús y sus discípulos por las aldeas de Cesarea de Filipo. Y en el camino preguntó á sus discípulos, diciéndoles: ¿Quién dicen los hombres que soy yo? 28 Y ellos respondieron: Juan Bautista; y otros, Elías; y otros, Alguno de los profetas. 29 Entonces él les dice: Y vosotros, ¿quién decís que soy yo? Y respondiendo Pedro, le dice: Tú eres el Cristo. 30 Y les apercibió que no hablasen de él á ninguno. 31 Y comenzó á enseñarles, que convenía que el Hijo del hombre padeciese mucho, y ser reprobado de los ancianos, y de los príncipes de los sacerdotes, y de los escribas, y ser muerto, y resucitar después de tres días."}, {"t": "t", "x": "En ARISE, nuestra misión es alcanzar a la próxima generación, ayudándoles a experimentar a Jesús de forma tan poderosa que lleguen a hacer discípulos."}, {"t": "h", "x": "Parte 7: ¿qué es un discípulo?"}, {"t": "note", "k": "do", "x": "Repasa los cinco puntos clave, luego señala el código QR y recuérdales que el Nivel 2 es el segundo sábado."}, {"t": "s", "ref": "Mateo 4:19", "v": "Y díceles: Venid en pos de mí, y os haré pescadores de hombres."}, {"t": "f", "x": "Un discípulo ___ y ___ a Jesús.", "a": [["conoce"], ["sigue"]]}, {"t": "f", "x": "Un discípulo está siendo ___ por Jesús.", "a": [["transformado", "cambiado"]]}, {"t": "f", "x": "Un discípulo se está ___ a Jesús en su misión.", "a": [["uniendo", "sumando"]]}, {"t": "baptism"}, {"t": "feedback", "q": ["¿Qué fue lo que más te interesó del Nivel 1 de El Camino?", "¿Qué es lo que más esperas aprender en las próximas sesiones de El Camino?"]}, {"t": "aboutyou"}]}, {"n": 2, "title": "Descubre el método", "sub": "Vivir en relación y en misión", "sab": "Segundo sábado", "icon": "circles", "blocks": [{"t": "note", "k": "do", "x": "Saluda al grupo y preséntate."}, {"t": "note", "k": "ask", "x": "Pide a cada participante que diga su nombre. Si asistió al Nivel 1: \"¿Qué fue lo que más te impactó?\" Si es nuevo: \"¿Qué esperas de El Camino?\""}, {"t": "h", "x": "Parte 1: repaso del Nivel 1"}, {"t": "t", "x": "El Nivel 1 se enfocó en tu propósito — el porqué y el qué de tu vida en Dios."}, {"t": "h", "x": "Parte 2: introducción al Nivel 2"}, {"t": "t", "x": "Propósito: descubrir el método para vivir tu propósito por medio de las relaciones y la entrega generosa."}, {"t": "f", "x": "El método de ARISE: formar hacedores de discípulos por medio de los ___ ___ relacionales.", "a": [["grupos"], ["de vida", "devida"]]}, {"t": "h", "x": "Parte 3: los Grupos de Vida"}, {"t": "note", "k": "say", "x": "Explica el significado bíblico de los Grupos de Vida — el formato, las pautas, y por qué creemos que así nos llama Dios a compartir su Evangelio."}, {"t": "t", "x": "No fuimos creados para vivir la vida solos. Dios nos creó para la comunidad, y los Grupos de Vida son un lugar para compartir con otros, hacer vida juntos y crecer en la fe."}, {"t": "f", "x": "1. Un lugar para ___ y ser ___ — compartiendo la vida juntos.", "a": [["conocer"], ["conocidos", "conocido"]]}, {"t": "s", "ref": "Hechos 2:46-47", "v": "46 Y perseverando unánimes cada día en el templo, y partiendo el pan en las casas, comían juntos con alegría y con sencillez de corazón, 47 Alabando á Dios, y teniendo gracia con todo el pueblo. Y el Señor añadía cada día á la iglesia los que habían de ser salvos."}, {"t": "f", "x": "2. Un lugar para ___ los unos a los otros.", "a": [["amar", "amarnos"]]}, {"t": "s", "ref": "1 Juan 3:16", "v": "En esto hemos conocido el amor, porque él puso su vida por nosotros: también nosotros debemos poner nuestras vidas por los hermanos."}, {"t": "f", "x": "3. Un lugar para ___ ___ juntos.", "a": [["madurar", "crecer"], ["espiritualmente"]]}, {"t": "s", "ref": "Proverbios 27:17", "v": "Hierro con hierro se aguza; y el hombre aguza el rostro de su amigo."}, {"t": "h", "x": "Parte 4: los Grupos de Vida en ARISE Miami"}, {"t": "note", "k": "ask", "x": "¿Estás en un Grupo de Vida? Comparte tu experiencia."}, {"t": "f", "x": "Queremos ser una iglesia ___ grupos de vida, no una iglesia ___ grupos de vida.", "a": [["de"], ["con"]]}, {"t": "s", "ref": "Hechos 5:42", "v": "Y todos los días, en el templo y por las casas, no cesaban de enseñar y predicar á Jesucristo."}, {"t": "t", "x": "Los Grupos de Vida son variados y por intereses, se reúnen en tres temporadas al año, están abiertos a todos y cualquiera puede ser anfitrión — no hace falta ser experto en la Biblia."}, {"t": "lifegroup_link"}, {"t": "h", "x": "Parte 5: una entrega comprometida"}, {"t": "note", "k": "ask", "x": "¿Cuál ha sido tu experiencia con la entrega financiera?"}, {"t": "f", "x": "Jesús habló más de la entrega que del ___, del ___ o de la ___.", "a": [["cielo"], ["infierno"], ["oración", "oracion"]]}, {"t": "s", "ref": "1 Corintios 16:1-4", "v": "1 CUANTO á la colecta para los santos, haced vosotros también de la manera que ordené en las iglesias de Galacia. 2 Cada primer día de la semana cada uno de vosotros aparte en su casa, guardando lo que por la bondad de Dios pudiere; para que cuando yo llegare, no se hagan entonces colectas. 3 Y cuando habré llegado, los que aprobareis por cartas, á éstos enviaré que lleven vuestro beneficio á Jerusalem. 4 Y si fuere digno el negocio de que yo también vaya, irán conmigo."}, {"t": "t", "x": "En ARISE Miami practicamos el diezmo para el sostén del cuerpo de Cristo, la Iglesia. Reconocemos que dar el 10% de nuestros ingresos es la norma bíblica."}, {"t": "s", "ref": "Malaquías 3:10", "v": "Traed todos los diezmos al alfolí, y haya alimento en mi casa; y probadme ahora en esto, dice Jehová de los ejércitos, si no os abriré las ventanas de los cielos, y vaciaré sobre vosotros bendición hasta que sobreabunde."}, {"t": "s", "ref": "Proverbios 3:9-10", "v": "9 Honra á Jehová de tu sustancia, y de las primicias de todos tus frutos; 10 Y serán llenas tus trojes con abundancia, y tus lagares rebosarán de mosto."}, {"t": "t", "x": "Tres formas de dar: el diezmo — el primer 10%; las ofrendas — más allá del diezmo; y el don de dar, que es un don espiritual."}, {"t": "s", "ref": "1 Timoteo 6:18-19", "v": "18 Que hagan bien, que sean ricos en buenas obras, dadivosos, que con facilidad comuniquen; 19 Atesorando para sí buen fundamento para lo por venir, que echen mano á la vida eterna."}, {"t": "s", "ref": "Romanos 12:8", "v": "El que exhorta, en exhortar; el que reparte, hágalo en simplicidad; el que preside, con solicitud; el que hace misericordia, con alegría."}, {"t": "t", "x": "El diezmo se trata de confianza, no de dinero. Damos a Dios por medio de la iglesia, no a la iglesia."}, {"t": "giving_link"}, {"t": "h", "x": "Parte 6: cómo lo vivimos en ARISE"}, {"t": "note", "k": "do", "x": "Asegúrate de que todos sepan que la evaluación de dones es obligatoria antes del Nivel 3. Guíalos a registrar sus tres dones en la app antes de salir."}, {"t": "f", "x": "1. Lo hacemos por medio del discipulado ___ ___ ___.", "a": [["vida"], ["a"], ["vida"]]}, {"t": "f", "x": "2. Una entrega ___ y ___.", "a": [["involucrada", "comprometida"], ["comprometida", "constante", "fiel"]]}, {"t": "f", "x": "3. Por medio de un ___ de compañerismo — que veremos en el Nivel 4.", "a": [["pacto"]]}, {"t": "homework"}, {"t": "gifts"}, {"t": "feedback", "q": ["¿Qué fue lo que más te interesó del Nivel 2 de El Camino?", "¿Qué es lo que más esperas aprender en las próximas sesiones de El Camino?"]}]}, {"n": 3, "title": "Descubre tus dones", "sub": "Tus dones, y dónde encajan", "sab": "Tercer sábado", "icon": "gift", "blocks": [{"t": "note", "k": "ask", "x": "Repaso: ¿Para qué fuiste creado? ¿Cuál es nuestra declaración de misión? ¿Cómo definimos a un discípulo?"}, {"t": "note", "k": "say", "x": "Recuerda: queremos discípulos plenamente empoderados que caminen en sus dones."}, {"t": "h", "x": "Parte 1: repaso"}, {"t": "t", "x": "Queremos discípulos plenamente empoderados que caminen en sus dones."}, {"t": "h", "x": "Parte 2: bienvenida al Nivel 3"}, {"t": "t", "x": "La meta de hoy: repasar el inventario de dones espirituales y explorar cómo se aplica."}, {"t": "s", "ref": "Romanos 12:4-6", "v": "4 Porque de la manera que en un cuerpo tenemos muchos miembros, empero todos los miembros no tienen la misma operación; 5 Así muchos somos un cuerpo en Cristo, mas todos miembros los unos de los otros. 6 De manera que, teniendo diferentes dones según la gracia que nos es dada, si el de profecía, úsese conforme á la medida de la fe;"}, {"t": "t", "x": "Cada persona es única e irreemplazable en el cuerpo de Cristo. Nuestros dones son dados por gracia, para el beneficio del cuerpo."}, {"t": "s", "ref": "1 Pedro 4:10", "v": "Cada uno según el don que ha recibido, adminístrelo á los otros, como buenos dispensadores de las diferentes gracias de Dios."}, {"t": "h", "x": "Parte 4: repaso de los dones espirituales"}, {"t": "mygifts"}, {"t": "note", "k": "ask", "x": "¿Qué te pareció la evaluación? Tómate unos minutos para conocer la experiencia de cada persona."}, {"t": "note", "k": "do", "x": "Invita a cada persona a compartir sus tres dones. Lee cada definición en voz alta. Pregunta: \"¿Qué opinas de este don?\" \"¿Dónde lo has visto en tu vida?\" \"¿Cómo ves que estos dones se complementan?\""}, {"t": "giftlist"}, {"t": "s", "ref": "1 Corintios 12:4-27", "v": "4 Empero hay repartimiento de dones; mas el mismo Espíritu es. 5 Y hay repartimiento de ministerios; mas el mismo Señor es. 6 Y hay repartimiento de operaciones; mas el mismo Dios es el que obra todas las cosas en todos. 7 Empero á cada uno le es dada manifestación del Espíritu para provecho. 8 Porque á la verdad, á éste es dada por el Espíritu palabra de sabiduría; á otro, palabra de ciencia según el mismo Espíritu; 9 A otro, fe por el mismo Espíritu; y á otro, dones de sanidades por el mismo Espíritu; 10 A otro, operaciones de milagros; y á otro, profecía; y á otro, discreción de espíritus; y á otro, géneros de lenguas; y á otro, interpretación de lenguas. 11 Mas todas estas cosas obra uno y el mismo Espíritu, repartiendo particularmente á cada uno como quiere. 12 Porque de la manera que el cuerpo es uno, y tiene muchos miembros, empero todos los miembros del cuerpo, siendo muchos, son un cuerpo, así también Cristo. 13 Porque por un Espíritu somos todos bautizados en un cuerpo, ora Judíos ó Griegos, ora siervos ó libres; y todos hemos bebido de un mismo Espíritu. 14 Pues ni tampoco el cuerpo es un miembro, sino muchos. 15 Si dijere el pie: Porque no soy mano, no soy del cuerpo: ¿por eso no será del cuerpo? 16 Y si dijere la oreja: Porque no soy ojo, no soy del cuerpo: ¿por eso no será del cuerpo? 17 Si todo el cuerpo fuese ojo, ¿dónde estaría el oído? Si todo fuese oído, ¿dónde estaría el olfato? 18 Mas ahora Dios ha colocado los miembros cada uno de ellos en el cuerpo, como quiso. 19 Que si todos fueran un miembro, ¿dónde estuviera el cuerpo? 20 Mas ahora muchos miembros son á la verdad, empero un cuerpo. 21 Ni el ojo puede decir á la mano: No te he menester: ni asimismo la cabeza á los pies: No tengo necesidad de vosotros. 22 Antes, mucho más los miembros del cuerpo que parecen más flacos, son necesarios; 23 Y á aquellos del cuerpo que estimamos ser más viles, á éstos vestimos más honrosamente; y los que en nosotros son menos honestos, tienen más compostura. 24 Porque los que en nosotros son más honestos, no tienen necesidad: mas Dios ordenó el cuerpo, dando más abundante honor al que le faltaba; 25 Para que no haya desavenencia en el cuerpo, sino que los miembros todos se interesen los unos por los otros. 26 Por manera que si un miembro padece, todos los miembros á una se duelen; y si un miembro es honrado, todos los miembros á una se gozan. 27 Pues vosotros sois el cuerpo de Cristo, y miembros en parte."}, {"t": "h", "x": "Parte 5: mi historia con Jesús"}, {"t": "note", "k": "say", "x": "Contar historias es parte esencial de ARISE Miami. Nadie puede refutar tu historia y es una gran herramienta de evangelismo. Compartamos nuestras historias."}, {"t": "note", "k": "do", "x": "Divide en grupos de tres. No coloques a los cónyuges juntos. Cada persona comparte por cinco minutos. Refuerza: tu historia es poderosa y no puede ser refutada."}, {"t": "t", "x": "Contar historias es parte esencial de ARISE Miami. Nadie puede refutar tu historia, y es una herramienta poderosa de evangelismo."}, {"t": "reflect", "x": "¿Cómo era tu vida antes de Jesús?"}, {"t": "reflect", "x": "¿Cómo llegaste a conocer a Jesús?"}, {"t": "reflect", "x": "¿Cómo es tu vida desde entonces?"}, {"t": "h", "x": "Parte 6: la historia de ARISE"}, {"t": "note", "k": "ask", "x": "Comparte las distintas iniciativas de ARISE y pregunta dónde se han sentido inspirados a unirse."}, {"t": "t", "x": "ARISE nació de la fusión de dos iglesias separadas por una generación — New Community e Ignite Fellowship — comprometidas a seguir siendo eficaces en un mundo cambiante."}, {"t": "t", "x": "Valores centrales: Jesús y su Palabra. Aceptación. Innovación. Servicio. Alcanzar a la próxima generación. Formar hacedores de discípulos."}, {"t": "t", "x": "Lema: Lo que sea necesario. Mientras no sea ilegal, inmoral ni engorde, lo intentamos."}, {"t": "h", "x": "Parte 7: repaso"}, {"t": "t", "x": "Tu historia, la historia de Jesús y la historia de ARISE se están cruzando. Tienes un llamado único e irreemplazable."}, {"t": "feedback", "q": ["¿Qué fue lo que más te interesó del Nivel 3 de El Camino?", "¿Qué es lo que más esperas aprender en las próximas sesiones de El Camino?"]}]}, {"n": 4, "title": "Descubre tu impacto", "sub": "Familia, iglesia, ciudad", "sab": "Cuarto sábado", "icon": "target", "blocks": [{"t": "note", "k": "do", "x": "Saluda al grupo y preséntate."}, {"t": "note", "k": "ask", "x": "Repaso del Nivel 1: ¿Cuál es la misión a la que Dios nos ha llamado? ¿Cómo definimos a un discípulo?"}, {"t": "note", "k": "ask", "x": "Repaso del Nivel 2: ¿Qué aprendiste sobre vivir una vida comprometida? ¿Qué te inspiró y qué te desafió más?"}, {"t": "note", "k": "ask", "x": "Repaso del Nivel 3: ¿Qué te ayudó más a descubrir tus dones espirituales? ¿Qué te sorprendió de tu historia? ¿Cómo podría Dios usarla para alcanzar a otros?"}, {"t": "h", "x": "Parte 1: la iglesia en misión"}, {"t": "t", "x": "Repaso: ¿cuál es la misión a la que Dios nos ha llamado? ¿Cómo definimos a un discípulo? ¿Qué descubriste sobre tus dones?"}, {"t": "h", "x": "Parte 2: plenamente comprometido en ARISE Miami"}, {"t": "note", "k": "say", "x": "Estas son las rampas de entrada para crecer en relación con Dios y con las personas, madurando como discípulos de Jesús."}, {"t": "t", "x": "Adorar juntos — el culto del sábado, los eventos de toda la iglesia y las reuniones de grupos medianos."}, {"t": "t", "x": "Conectarse profundamente — El Camino, el bautismo, los Grupos de Vida y Base Camp."}, {"t": "t", "x": "Dar con compromiso — tiempo, talento y recursos."}, {"t": "t", "x": "Servir con generosidad — formando parte de un equipo de ministerio."}, {"t": "t", "x": "Servir a Miami — la iglesia local, las misiones y las personas necesitadas."}, {"t": "t", "x": "Estas son las rampas de entrada para crecer en relación con Dios y con las personas, madurando como discípulos de Jesús."}, {"t": "h", "x": "Parte 3: Pacto de Compañerismo de ARISE Miami"}, {"t": "note", "k": "do", "x": "Lean el pacto juntos en voz alta. Dales tiempo para leerlo de verdad antes de firmar — es un compromiso, no un formulario."}, {"t": "covenant"}, {"t": "h", "x": "Parte 4: siguientes pasos"}, {"t": "note", "k": "do", "x": "Guíalos a elegir un ministerio en la app. Recuérdales que sus dones son una guía, no un límite. Quien no esté seguro debe igual elegir \"todavía no estoy seguro\" para que Siguientes Pasos les dé seguimiento."}, {"t": "t", "x": "Ser miembro de ARISE Miami no se trata de añadir tu nombre a una lista — se trata de conectarte con las personas y con la visión de la iglesia."}, {"t": "ministry"}, {"t": "feedback", "q": ["¿Qué fue lo que más te interesó del Nivel 4 de El Camino?"]}]}], "GIFTS": [["evangelism", "Evangelismo", "Una capacidad y un entusiasmo especiales para comunicar las buenas nuevas de salvación en Cristo a quienes aún no creen.", "Hechos 8:4-8"], ["prophecy", "Profecía", "La capacidad especial de recibir y comunicar un mensaje oportuno de Dios a una persona o a un grupo.", "Hechos 27:21-26"], ["teaching", "Enseñanza / Predicación", "La capacidad de comprender las verdades espirituales y explicarlas con claridad a otros.", "Hechos 20:20"], ["exhortation", "Exhortación / Ánimo", "El don de ofrecer consuelo, consolación y ánimo a quienes están desanimados, confundidos o vacilantes en su fe.", "Hechos 11:22-24"], ["shepherding", "Pastoreo", "La capacidad dada por Dios de cuidar las necesidades espirituales de un grupo de creyentes y guiarlos a crecer en su fe.", "1 Pedro 5:1-4"], ["serving", "Servicio / Ayuda", "El don de aportar valor espiritual al cumplimiento de las tareas, trabajando junto a otros y liberándolos para usar sus propios dones.", "Hechos 9:36"], ["mercy_showing", "Misericordia", "El don de sentir empatía y compasión por quienes sufren, con un fuerte deseo de servirles y aliviar su dolor.", "Hechos 16:33"], ["giving", "Generosidad", "Un amor dado por Dios por compartir los recursos que uno tiene, sean muchos o pocos, para el beneficio del cuerpo de Cristo.", "Lucas 21:1-4"], ["administration", "Administración", "La capacidad especial de comprender metas inmediatas y a largo plazo, y de organizar personas, información y materiales para alcanzarlas.", "Hechos 6:2-7"]], "MIN": [["Siguientes Pasos", "Ayudar a las personas a dar su próximo paso y encontrar dónde pertenecen.", ["Recibir a los visitantes", "Seguimiento y conexión", "Misiones y alcance", "Servicio comunitario"], ["evangelism", "exhortation", "shepherding"]], ["Hospitalidad", "Lograr que todo el que entra se sienta bienvenido y cuidado.", ["Recibir y ubicar", "Comida y refrigerios", "Preparación de eventos"], ["shepherding", "mercy_showing", "giving"]], ["Alabanza", "Guiar a la iglesia a la presencia de Dios por medio de la música.", ["Voces", "Instrumentos", "Planificación de la alabanza"], ["exhortation", "serving", "mercy_showing"]], ["Ministerio Juvenil", "Caminar junto a los jóvenes y adultos jóvenes mientras siguen a Jesús.", ["Adolescentes", "Adultos jóvenes", "Mentoría"], ["evangelism", "teaching", "exhortation"]], ["Ministerio Infantil / Seekers", "Presentar a Jesús a los niños y cuidarlos bien.", ["Enseñar una clase", "Registro y seguridad infantil", "Manualidades y actividades"], ["teaching", "serving", "giving"]], ["Grupos de Vida", "Discipulado de vida a vida en los hogares, y las reuniones que nos unen.", ["Ser anfitrión", "Co-liderar un grupo", "Reuniones y eventos", "Discipulado de vida a vida"], ["evangelism", "prophecy", "shepherding"]], ["Producción", "Hacer que el culto funcione — sonido, video e iluminación.", ["Sonido", "Video y transmisión", "Iluminación", "Diapositivas"], ["prophecy", "serving", "administration"]], ["Creatividad y Redes", "Diseño y redes sociales — cómo se ve y se escucha ARISE en línea.", ["Diseño gráfico", "Foto y video", "Redes sociales"], ["prophecy", "teaching", "administration"]], ["Tras Bastidores", "Recursos, administración e instalaciones — el trabajo que sostiene todo lo demás.", ["Mantenimiento e instalaciones", "Oficina y administración", "Recursos y suministros"], ["mercy_showing", "giving", "administration"]]], "COV": [["1. Proteger la unidad de mi iglesia", ["Actuando en amor hacia los demás", "Rechazando el chisme", "Apoyando al liderazgo", "Resolviendo los conflictos bíblicamente"], ["Romanos 14:19", "Efesios 4:29", "Hebreos 13:17"]], ["2. Compartir la responsabilidad de mi iglesia", ["Orando por su crecimiento y salud", "Invitando a otros a asistir", "Recibiendo con calidez a los visitantes"], ["1 Tesalonicenses 1:1-2", "Lucas 14:23", "Romanos 15:7"]], ["3. Servir en el ministerio de mi iglesia", ["Descubriendo mis dones y talentos", "Usándolos para servir a otros", "Desarrollando un corazón de siervo"], ["1 Pedro 4:10", "Efesios 4:11-12", "Filipenses 2:4-5"]], ["4. Sostener el testimonio de mi iglesia", ["Asistiendo fielmente a la iglesia y a los grupos", "Viviendo una vida piadosa", "Dando con regularidad"], ["Hechos 2:42", "Hebreos 10:25", "Filipenses 1:27"]]], "P": {"Filipenses 2:4-5": "4 No mirando cada uno á lo suyo propio, sino cada cual también á lo de los otros. 5 Haya, pues, en vosotros este sentir que hubo también en Cristo Jesús:", "Hechos 8:4-8": "4 Mas los que fueron esparcidos, iban por todas partes anunciando la palabra. 5 Entonces Felipe, descendiendo á la ciudad de Samaria, les predicaba á Cristo. 6 Y las gentes escuchaban atentamente unánimes las cosas que decía Felipe, oyendo y viendo las señales que hacía. 7 Porque de muchos que tenían espíritus inmundos, salían éstos dando grandes voces; y muchos paralíticos y cojos eran sanados: 8 Así que había gran gozo en aquella ciudad.", "1 Timoteo 6:18-19": "18 Que hagan bien, que sean ricos en buenas obras, dadivosos, que con facilidad comuniquen; 19 Atesorando para sí buen fundamento para lo por venir, que echen mano á la vida eterna.", "Romanos 3:23": "Por cuanto todos pecaron, y están destituídos de la gloria de Dios;", "Mateo 28:18-20": "18 Y llegando Jesús, les habló, diciendo: Toda potestad me es dada en el cielo y en la tierra. 19 Por tanto, id, y doctrinad á todos los Gentiles, bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo: 20 Enseñándoles que guarden todas las cosas que os he mandado: y he aquí, yo estoy con vosotros todos los días, hasta el fin del mundo. Amén.", "Efesios 4:29": "Ninguna palabra torpe salga de vuestra boca, sino la que sea buena para edificación, para que dé gracia á los oyentes.", "Juan 17:3": "Esta empero es la vida eterna: que te conozcan el solo Dios verdadero, y á Jesucristo, al cual has enviado.", "Hechos 2:42": "Y perseveraban en la doctrina de los apóstoles, y en la comunión, y en el partimiento del pan, y en las oraciones.", "Proverbios 27:17": "Hierro con hierro se aguza; y el hombre aguza el rostro de su amigo.", "1 Corintios 16:1-4": "1 CUANTO á la colecta para los santos, haced vosotros también de la manera que ordené en las iglesias de Galacia. 2 Cada primer día de la semana cada uno de vosotros aparte en su casa, guardando lo que por la bondad de Dios pudiere; para que cuando yo llegare, no se hagan entonces colectas. 3 Y cuando habré llegado, los que aprobareis por cartas, á éstos enviaré que lleven vuestro beneficio á Jerusalem. 4 Y si fuere digno el negocio de que yo también vaya, irán conmigo.", "Hechos 2:37-38": "37 Entonces oído esto, fueron compungidos de corazón, y dijeron á Pedro y á los otros apóstoles: Varones hermanos, ¿qué haremos? 38 Y Pedro les dice: Arrepentíos, y bautícese cada uno de vosotros en el nombre de Jesucristo para perdón de los pecados; y recibiréis el don del Espíritu Santo.", "Hechos 11:22-24": "22 Y llegó la fama de estas cosas á oídos de la iglesia que estaba en Jerusalem: y enviaron á Bernabé que fuese hasta Antioquía. 23 El cual, como llegó, y vió la gracia de Dios, regocijóse; y exhortó á todos á que permaneciesen en el propósito del corazón en el Señor. 24 Porque era varón bueno, y lleno de Espíritu Santo y de fe: y mucha compañía fué agregada al Señor.", "Romanos 12:8": "El que exhorta, en exhortar; el que reparte, hágalo en simplicidad; el que preside, con solicitud; el que hace misericordia, con alegría.", "Hebreos 13:17": "Obedeced á vuestros pastores, y sujetaos á ellos; porque ellos velan por vuestras almas, como aquellos que han de dar cuenta; para que lo hagan con alegría, y no gimiendo; porque esto no os es útil.", "Marcos 8:27-31": "27 Y salió Jesús y sus discípulos por las aldeas de Cesarea de Filipo. Y en el camino preguntó á sus discípulos, diciéndoles: ¿Quién dicen los hombres que soy yo? 28 Y ellos respondieron: Juan Bautista; y otros, Elías; y otros, Alguno de los profetas. 29 Entonces él les dice: Y vosotros, ¿quién decís que soy yo? Y respondiendo Pedro, le dice: Tú eres el Cristo. 30 Y les apercibió que no hablasen de él á ninguno. 31 Y comenzó á enseñarles, que convenía que el Hijo del hombre padeciese mucho, y ser reprobado de los ancianos, y de los príncipes de los sacerdotes, y de los escribas, y ser muerto, y resucitar después de tres días.", "Romanos 12:4-6": "4 Porque de la manera que en un cuerpo tenemos muchos miembros, empero todos los miembros no tienen la misma operación; 5 Así muchos somos un cuerpo en Cristo, mas todos miembros los unos de los otros. 6 De manera que, teniendo diferentes dones según la gracia que nos es dada, si el de profecía, úsese conforme á la medida de la fe;", "1 Juan 3:16": "En esto hemos conocido el amor, porque él puso su vida por nosotros: también nosotros debemos poner nue const L=DATA.L,GIFTS=DATA.GIFTS,MIN=DATA.MIN,COV=DATA.COV,P=DATA.P;
let cur=1;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const KIND={say:'Di',ask:'Pregunta',do:'Haz'};

function tabs(){
  document.getElementById('tabs').innerHTML=L.map(l=>
    `<button class="tab ${l.n===cur?'on':''}" data-n="${l.n}">Nivel ${l.n} &middot; ${esc(l.title)}</button>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{cur=+t.dataset.n;draw();window.scrollTo({top:0});});
}

function block(b){
  if(b.t==='note') return `<div class="note ${b.k}"><b>${KIND[b.k]}</b>${esc(b.x)}</div>`;
  if(b.t==='h') return `<div class="blk h">${esc(b.x)}</div>`;
  if(b.t==='t') return `<div class="blk t">${esc(b.x)}</div>`;
  if(b.t==='s') return `<div class="blk s"><div class="ref">${esc(b.ref)} &middot; RV1909</div>
    <div class="vt">${esc(b.v)}</div></div>`;
  if(b.t==='f'){let k=-1;
    const x=esc(b.x).replace(/___/g,()=>{k++;
      const a=b.a[k][0].replace(/^./,c=>c.toUpperCase());
      return `<span class="fill">${esc(a)}</span>`;});
    return `<div class="blk"><div class="ans">${x}</div></div>`;}
  if(b.t==='baptism') return `<div class="box"><h3>Invitación al bautismo</h3>
    <p>En la app eligen una de tres opciones: <b>Sí, quiero bautizarme</b> &middot;
    <b>Tengo preguntas</b> &middot; <b>Todavía no</b>.</p>
    <p style="margin-top:8px">Las dos primeras notifican al pastor Kendall el mismo día y pasan al equipo de preparación bautismal.</p></div>`;
  if(b.t==='lifegroup_link') return `<div class="box"><h3>Elige tu Grupo de Vida</h3>
    <p>Aquí la app muestra un botón que abre los Grupos de Vida abiertos en Church Center:
    <b>arisemiami.churchcenter.com/groups/life-groups</b></p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">Dales un minuto para mirar y elegir un grupo antes de seguir. En algunos grupos se inscriben directamente; en otros envían una solicitud al líder.</p>
    <!-- lghelp-note --><p style="margin-top:6px">Debajo del botón hay una casilla: <b>&ldquo;Me gustaría ayuda para encontrar un Grupo de Vida.&rdquo;</b> Quien la marque queda señalado para que el equipo le dé seguimiento.</p></div>`;
  if(b.t==='giving_link') return `<div class="box"><h3>Da en línea</h3>
    <p>Aquí la app muestra un botón que abre Adventist Giving:
    <b>adventistgiving.org/donate/ANTBS4</b></p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">Menciónalo, pero no te detengas demasiado &mdash; la enseñanza se trata de confianza, no de la transacción.</p></div>`;
  if(b.t==='homework') return `<div class="box"><h3>Tarea antes del Nivel 3</h3>
    <p>Evaluación de dones espirituales en gifts.churchgrowth.org &mdash; 108 preguntas, unos 25 minutos.
    Obligatoria antes del Nivel 3. Registran sus tres dones principales en la app.</p></div>`;
  if(b.t==='gifts') return `<div class="box"><h3>Registrar sus tres dones principales</h3>
    <p>Aquí la app muestra los nueve dones. Cada participante toca sus tres primeros resultados de la evaluación, en orden.
    El Nivel 3 queda bloqueado hasta que registren los tres.</p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">La mayoría hará la evaluación en casa &mdash; recuérdales volver a esta pantalla y registrar sus resultados antes del Nivel 3.</p></div>`;
  if(b.t==='welcome') return `<div class="box"><h3>Antes del Nivel 1: una bienvenida rápida</h3><p>La primera vez que alguien abre un nivel, la app le pide nombre y apellido, correo y teléfono celular &mdash; unos 20 segundos. No se le vuelve a pedir en ese teléfono.</p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">Dales un minuto para hacerlo antes de comenzar a enseñar.</p></div>`;
  if(b.t==='aboutyou') return `<div class="box"><h3>Queremos conocerte</h3><p>Al final del Nivel 1 la app pide fecha de nacimiento, género, estado civil, dirección y cómo conocieron ARISE &mdash; los mismos datos del formulario del Nivel 1. No pueden terminar el Nivel 1 sin esto.</p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">Solo el equipo de ARISE ve esta información.</p></div>`;
  if(b.t==='feedback') return `<div class="box"><h3>Antes de terminar</h3><p>La app pregunta:</p>
    <ul style="margin:8px 0 0 18px">${b.q.map(q=>`<li style="margin-bottom:4px">${esc(q)}</li>`).join('')}</ul>
    <p style="margin-top:8px;color:var(--muted);font-size:13px">Obligatorio para terminar el nivel. Las respuestas se envían al equipo de ARISE.</p></div>`;
  if(b.t==='mygifts') return `<div class="box"><h3>Sus tres dones principales</h3>
    <p>Cada participante ve aquí sus propios tres dones, con definiciones y pasajes. Invita a cada persona a compartirlos en voz alta.</p></div>`;
  if(b.t==='giftlist') return `<div class="box"><h3>Los nueve dones &mdash; léelos en voz alta según haga falta</h3>
    ${GIFTS.map(g=>`<div class="gitem"><b>${esc(g[1])}</b><p>${esc(g[2])}</p>
      <div class="r">${esc(g[3])}</div><div class="gscrip">${esc(P[g[3]]||'')}</div></div>`).join('')}</div>`;
  if(b.t==='reflect') return `<div class="box"><h3>Pregunta de reflexión</h3><p><b>${esc(b.x)}</b></p>
    <p style="margin-top:6px;color:var(--muted);font-size:13px">Se escribe en privado en la app. No hay respuesta correcta.</p></div>`;
  if(b.t==='covenant') return `<div class="box"><h3>Pacto de Compañerismo de ARISE Miami</h3>
    <p>Habiendo recibido a Jesucristo como Señor y Salvador, habiendo sido bautizado, y estando de acuerdo con la misión de ARISE, me comprometo a:</p>
    ${COV.map(c=>`<div class="cvsec"><b>${esc(c[0])}</b><ul>${c[1].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      <div class="rf">${c[2].map(esc).join(' &middot; ')}</div></div>`).join('')}
    <p style="margin-top:12px"><b>Firman en la app.</b> Las firmas son permanentes y quedan fechadas.</p></div>`;
  if(b.t==='ministry') return `<div class="box"><h3>Elegir un ministerio</h3>
    <p>La app recomienda tres equipos según sus dones, y luego muestra los nueve. Todos los equipos están abiertos para todos.</p>
    <div class="chiplist">${MIN.map(m=>`<span class="chip">${esc(m[0])}</span>`).join('')}</div>
    <p style="margin-top:11px">Cada uno tiene roles específicos. Quien no esté seguro debe elegir igualmente
    <b>"todavía no estoy seguro"</b> para que Siguientes Pasos les dé seguimiento y no se pierdan.</p></div>`;
  return '';
}

function draw(){
  const l=L[cur-1];
  document.getElementById('ttl').textContent='Nivel '+l.n+' — '+l.title;
  const nb=l.blocks.filter(b=>b.t==='f').reduce((a,b)=>a+b.a.length,0);
  document.getElementById('body').innerHTML=`
   <div class="lh"><div class="lv">Nivel ${l.n} &middot; ${esc(l.sab)}</div>
    <h2>${esc(l.title)}</h2><p>${esc(l.sub)}</p>
    <div class="meta"><span>inicio <b>9:00 AM</b></span><span><b>90</b> minutos</span>
    ${nb?`<span><b>${nb}</b> espacios</span>`:''}
    <span>Código <b>4827</b></span></div></div>
   ${l.blocks.map(block).join('')}`;
  tabs();
}
draw();
</script></body></html>
