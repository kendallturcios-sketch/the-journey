<style>

 padding:13px 15px;box-shadow:0 8px 24px rgba(8,42,46,.14);display:flex;align-items:center;gap:12px}

 background:#fff;border-radius:15px;padding:14px 15px;margin-bottom:10px;cursor:pointer;font-family:var(--b);
 transition:transform .16s,box-shadow .16s}

.card .ic{width:44px;height:44px;border-radius:50%;flex:0 0 auto;background:var(--ink);display:grid;place-items:center}
.card.locked .ic{background:#B8C6CE}.card.done .ic{background:var(--grass)}

.lh h2{font-family:var(--d);font-size:25px;font-weight:800;letter-spacing:-.01em;margin:5px 0 7px}

.cnt{margin-top:12px;display:inline-block;font-size:11.5px;color:var(--muted);background:var(--paper);
 border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.saved{margin-top:12px;display:inline-block;font-size:12px;font-weight:600;color:#2E7D55;
 background:#EDF8F2;border:1px solid #BFE6D3;border-radius:999px;padding:5px 13px}
.blk{margin-bottom:19px}
.blk.h{font-family:var(--d);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
 margin:32px 0 13px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.blk.h:first-child{margin-top:4px}
.blk.t{font-size:15.5px;line-height:1.62;color:#22384F}
.blk.s{border-left:3px solid var(--teal);padding:2px 0 2px 14px}
.blk.s .ref{font-family:var(--d);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}

 border-radius:4px;padding:1px 5px;vertical-align:1px}
.blk.s .vt{font-size:15px;line-height:1.6;color:#3A4F62;font-style:italic;margin-top:4px}

.slot{display:inline-block;position:relative;min-width:98px;margin:0 2px}

 border-bottom:2.5px solid #C6D3DA;background:transparent;padding:0 3px 2px;text-align:center;outline:none;transition:border-color .18s}

.slot.ok input{color:var(--grass);border-bottom-color:var(--grass)}
.slot.rev input{color:#A8814A;border-bottom-color:#D9BE8E}
.slot.bad input{border-bottom-color:#D2554E;animation:nu .3s}
@keyframes nu{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fn{margin-top:10px;font-size:12.5px;line-height:1.4;min-height:16px;color:var(--muted)}
.fn.err{color:#C0453E}.fn.rev{color:#A8814A}
.box{background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px 18px;margin-bottom:19px}
.box h3{font-family:var(--d);font-size:17px;font-weight:800;margin-bottom:7px}

.opt .rd{width:19px;height:19px;border-radius:50%;border:2px solid #C6D3DA;flex:0 0 auto;margin-top:1px;position:relative}

 border-radius:999px;padding:8px 13px;margin:0 6px 7px 0;font-size:13.5px;cursor:pointer;font-family:var(--b)}

.cb{width:18px;height:18px;border:2px solid #C6D3DA;border-radius:5px;flex:0 0 auto;position:relative;background:#fff}
.cb.on{background:var(--grass);border-color:var(--grass)}
.cb.on::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(43deg)}
.btn{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--ink);
 color:#fff;font-family:var(--d);font-size:13.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}

.fin{padding:36px 24px;text-align:center}
.fin h2{font-family:var(--d);font-size:27px;font-weight:800;line-height:1.06}

.rule{width:42px;height:3px;background:var(--teal);margin:16px auto}
.codebox{display:flex;gap:10px;justify-content:center;margin:26px 0 12px}

 border:2px solid var(--line);border-radius:13px;background:#fff;outline:none}
.digit:focus{border-color:var(--teal)}.digit.bad{border-color:#D2554E;animation:nu .3s}
.cn{font-size:12.5px;color:var(--muted);line-height:1.45;min-height:34px}.cn.err{color:#C0453E;font-weight:600}

 vivamos en este siglo templada, y justa, y píamente, 13 Esperando aquella esperanza bienaventurada, y la manifestación gloriosa del gran Dios y Salvador nuestro Jesucristo,"}, {"t": "t", "x": "La gracia va delante. Jesús toma la iniciativa y hace su parte primero."}, {"t": "s", "ref": "Romanos 5:8", "v": "Mas Dios encarece su caridad para con nosotros, porque siendo aún pecadores, Cristo murió por nosotros."}, {"t": "t", "x": "La justificación es el acto por el cual Dios traslada a una persona dispuesta del estado de pecado al estado de gracia."}, {"t": "f", "x": "Nuestra parte es ___, invocar el nombre del Señor.", "a": [["creer"]]}, {"t": "s", "ref": "Romanos 10:9-13", "v": "9 Que si confesares con tu boca al Señor Jesús, y creyeres en tu corazón que Dios le levantó de los muertos, serás salvo. 10 Porque con el corazón se cree para justicia; mas con la boca se hace confesión para salud. 11 Porque la Escritura dice: Todo aquel que en él creyere, no será avergonzado. 12 Porque no hay diferencia de Judío y de Griego: porque el mismo que es Señor de todos, rico es para con todos los que le invocan: 13 Porque todo aquel que invocare el nombre del Señor, será salvo."}, {"t": "t", "x": "Nota: este no es un proceso perfectamente lineal — hay subidas, bajadas, avances y retrocesos."}, {"t": "h", "x": "Seguir a Jesús"}, {"t": "s", "ref": "Tito 2:12", "v": "Enseñándonos que, renunciando á la impiedad y á los deseos mundanos, vivamos en este siglo templada, y justa, y píamente,"}, {"t": "t", "x": "Ya no tenemos un problema de pecado — estamos aprendiendo a vivir en justicia."}, {"t": "s", "ref": "Romanos 8:1", "v": "AHORA pues, ninguna condenación hay para los que están en Cristo Jesús, los que no andan conforme á la carne, mas conforme al espíritu."}, {"t": "t", "x": "La santificación es la acción o el proceso de ser librado del pecado y purificado."}, {"t": "h", "x": "Parte 4: justificación y santificación"}, {"t": "t", "x": "La justificación libra a las personas de la pena del pecado; la santificación las libra del poder del pecado."}, {"t": "t", "x": "La justificación es algo que Dios hace por nosotros; la santificación es lo que Dios hace con nosotros."}, {"t": "t", "x": "La justificación ocurre al instante, en el momento del nuevo nacimiento; la santificación ocurre gradualmente, a lo largo de toda la vida."}, {"t": "h", "x": "Parte 5: el siguiente paso — el bautismo"}, {"t": "t", "x": "El bautismo es una señal externa de un cambio interno — la expresión visible de una realidad invisible."}, {"t": "t", "x": "La palabra griega baptidzo significa sumergir. El bautismo bíblico es por inmersión."}, {"t": "s", "ref": "Mateo 28:18-20", "v": "18 Y llegando Jesús, les habló, diciendo: Toda potestad me es dada en el cielo y en la tierra. 19 Por tanto, id, y doctrinad á todos los Gentiles, bautizándolos en el nombre del Padre, y del Hijo, y del Espíritu Santo: 20 Enseñándoles que guarden todas las cosas que os he mandado: y he aquí, yo estoy con vosotros todos los días, hasta el fin del mundo. Amén."}, {"t": "s", "ref": "Hechos 2:37-38", "v": "37 Entonces oído esto, fueron compungidos de corazón, y dijeron á Pedro y á los otros apóstoles: Varones hermanos, ¿qué haremos? 38 Y Pedro les dice: Arrepentíos, y bautícese cada uno de vosotros en el nombre de Jesucristo para perdón de los pecados; y recibiréis el don del Espíritu Santo."}, {"t": "t", "x": "¿Quién puede bautizarse? Cualquiera que cree y acepta el Evangelio."}, {"t": "h", "x": "Parte 6: el Evangelio — 4 declaraciones"}, {"t": "f", "x": "El Reino de Dios ya está ___.", "a": [["aquí", "aqui"]]}, {"t": "f", "x": "Jesús es el ___, el ___ del mundo.", "a": [["cristo"], ["salvador"]]}, {"t": "f", "x": "Jesús ___ por nuestros pecados.", "a": [["murió", "murio"]]}, {"t": "f", "x": "Jesús ___ al tercer día.", "a": [["resucitó", "resucito"]]}, {"t": "h", "x": "3 respuestas clave"}, {"t": "f", "x": "___, ___ y ___.", "a": [["arrepentirse", "arrepiéntete", "arrepientete"], ["creer", "cree"], ["seguir", "sigue"]]}, {"t": "s", "ref": "Marcos 8:27-31", "v": "27 Y salió Jesús y sus discípulos por las aldeas de Cesarea de Filipo. Y en el camino preguntó á sus discípulos, diciéndoles: ¿Quién dicen los hombres que soy yo? 28 Y ellos respondieron: Juan Bautista; y otros, Elías; y otros, Alguno de los profetas. 29 Entonces él les dice: Y vosotros, ¿quién decís que soy yo? Y respondiendo Pedro, le dice: Tú eres el Cristo. 30 Y les apercibió que no hablasen de él á ninguno. 31 Y comenzó á enseñarles, que convenía que el Hijo del hombre padeciese mucho, y ser reprobado de los ancianos, y de los príncipes de los sacerdotes, y de los escribas, y ser muerto, y resucitar después de tres días."}, {"t": "t", "x": "En ARISE, nuestra misión es alcanzar a la próxima generación, ayudándoles a experimentar a Jesús de forma tan poderosa que lleguen a hacer discípulos."}, {"t": "h", "x": "Parte 7: ¿qué es un discípulo?"}, {"t": "s", "ref": "Mateo 4:19", "v": "Y díceles: Venid en pos de mí, y os haré pescadores de hombres."}, {"t": "f", "x": "Un discípulo ___ y ___ a Jesús.", "a": [["conoce"], ["sigue"]]}, {"t": "f", "x": "Un discípulo está siendo ___ por Jesús.", "a": [["transformado", "cambiado"]]}, {"t": "f", "x": "Un discípulo se está ___ a Jesús en su misión.", "a": [["uniendo", "sumando"]]}, {"t": "baptism"}]}, {"n": 2, "title": "Descubre el método", "sub": "Vivir en relación y en misión", "sab": "Segundo sábado", "icon": "circles", "blocks": [{"t": "h", "x": "Parte 1: repaso del Nivel 1"}, {"t": "t", "x": "El Nivel 1 se enfocó en tu propósito — el porqué y el qué de tu vida en Dios."}, {"t": "h", "x": "Parte 2: introducción al Nivel 2"}, {"t": "t", "x": "Propósito: descubrir el método para vivir tu propósito por medio de las relaciones y la entrega generosa."}, {"t": "f", "x": "El método de ARISE: formar hacedores de discípulos por medio de los ___ ___ relacionales.", "a": [["grupos"], ["de vida", "devida"]]}, {"t": "h", "x": "Parte 3: los Grupos de Vida"}, {"t": "t", "x": "No fuimos creados para vivir la vida solos. Dios nos creó para la comunidad, y los Grupos de Vida son un lugar para compartir con otros, hacer vida juntos y crecer en la fe."}, {"t": "f", "x": "1. Un lugar para ___ y ser ___ — compartiendo la vida juntos.", "a": [["conocer"], ["conocidos", "conocido"]]}, {"t": "s", "ref": "Hechos 2:46-47", "v": "46 Y perseverando unánimes cada día en el templo, y partiendo el pan en las casas, comían juntos con alegría y con sencillez de corazón, 47 Alabando á Dios, y teniendo gracia con todo el pueblo. Y el Señor añadía cada día á la iglesia los que habían de ser salvos."}, {"t": "f", "x": "2. Un lugar para ___ los unos a los otros.", "a": [["amar", "amarnos"]]}, {"t": "s", "ref": "1 Juan 3:16", "v": "En esto hemos conocido el amor, porque él puso su vida por nosotros: también nosotros debemos poner nuestras vidas por los hermanos."}, {"t": "f", "x": "3. Un lugar para ___ ___ juntos.", "a": [["madurar", "crecer"], ["espiritualmente"]]}, {"t": "s", "ref": "Proverbios 27:17", "v": "Hierro con hierro se aguza; y el hombre aguza el rostro de su amigo."}, {"t": "h", "x": "Parte 4: los Grupos de Vida en ARISE Miami"}, {"t": "f", "x": "Queremos ser una iglesia ___ grupos de vida, no una iglesia ___ grupos de vida.", "a": [["de"], ["con"]]}, {"t": "s", "ref": "Hechos 5:42", "v": "Y todos los días, en el templo y por las casas, no cesaban de enseñar y predicar á Jesucristo."}, {"t": "t", "x": "Los Grupos de Vida son variados y por intereses, se reúnen en tres temporadas al año, están abiertos a todos y cualquiera puede ser anfitrión — no hace falta ser experto en la Biblia."}, {"t": "lifegroup_link"}, {"t": "h", "x": "Parte 5: una entrega comprometida"}, {"t": "f", "x": "Jesús habló más de la entrega que del ___, del ___ o de la ___.", "a": [["cielo"], ["infierno"], ["oración", "oracion"]]}, {"t": "s", "ref": "1 Corintios 16:1-4", "v": "1 CUANTO á la colecta para los santos, haced vosotros también de la manera que ordené en las iglesias de Galacia. 2 Cada primer día de la semana cada uno de vosotros aparte en su casa, guardando lo que por la bondad de Dios pudiere; para que cuando yo llegare, no se hagan entonces colectas. 3 Y cuando habré llegado, los que aprobareis por cartas, á éstos enviaré que lleven vuestro beneficio á Jerusalem. 4 Y si fuere digno el negocio de que yo también vaya, irán conmigo."}, {"t": "t", "x": "En ARISE Miami practicamos el diezmo para el sostén del cuerpo de Cristo, la Iglesia. Reconocemos que dar el 10% de nuestros ingresos es la norma bíblica."}, {"t": "s", "ref": "Malaquías 3:10", "v": "Traed todos los diezmos al alfolí, y haya alimento en mi casa; y probadme ahora en esto, dice Jehová de los ejércitos, si no os abriré las ventanas de los cielos, y vaciaré sobre vosotros bendición hasta que sobreabunde."}, {"t": "s", "ref": "Proverbios 3:9-10", "v": "9 Honra á Jehová de tu sustancia, y de las primicias de todos tus frutos; 10 Y serán llenas tus trojes con abundancia, y tus lagares rebosarán de mosto."}, {"t": "t", "x": "Tres formas de dar: el diezmo — el primer 10%; las ofrendas — más allá del diezmo; y el don de dar, que es un don espiritual."}, {"t": "s", "ref": "1 Timoteo 6:18-19", "v": "18 Que hagan bien, que sean ricos en buenas obras, dadivosos, que con facilidad comuniquen; 19 Atesorando para sí buen fundamento para lo por venir, que echen mano á la vida eterna."}, {"t": "s", "ref": "Romanos 12:8", "v": "El que exhorta, en exhortar; el que reparte, hágalo en simplicidad; el que preside, con solicitud; el que hace misericordia, con alegría."}, {"t": "t", "x": "El diezmo se trata de confianza, no de dinero. Damos a Dios por medio de la iglesia, no a la iglesia."}, {"t": "giving_link"}, {"t": "h", "x": "Parte 6: cómo lo vivimos en ARISE"}, {"t": "f", "x": "1. Lo hacemos por medio del discipulado ___ ___ ___.", "a": [["vida"], ["a"], ["vida"]]}, {"t": "f", "x": "2. Una entrega ___ y ___.", "a": [["involucrada", "comprometida"], ["comprometida", "constante", "fiel"]]}, {"t": "f", "x": "3. Por medio de un ___ de compañerismo — que veremos en el Nivel 4.", "a": [["pacto"]]}, {"t": "homework"}, {"t": "gifts"}]}, {"n": 3, "title": "Descubre tus dones", "sub": "Tus dones, y dónde encajan", "sab": "Tercer sábado", "icon": "gift", "blocks": [{"t": "h", "x": "Parte 1: repaso"}, {"t": "t", "x": "Queremos discípulos plenamente empoderados que caminen en sus dones."}, {"t": "h", "x": "Parte 2: bienvenida al Nivel 3"}, {"t": "t", "x": "La meta de hoy: repasar el inventario de dones espirituales y explorar cómo se aplica."}, {"t": "s", "ref": "Romanos 12:4-6", "v": "4 Porque de la manera que en un cuerpo tenemos muchos miembros, empero todos los miembros no tienen la misma operación; 5 Así muchos somos un cuerpo en Cristo, mas todos miembros los unos de los otros. 6 De manera que, teniendo diferentes dones según la gracia que nos es dada, si el de profecía, úsese conforme á la medida de la fe;"}, {"t": "t", "x": "Cada persona es única e irreemplazable en el cuerpo de Cristo. Nuestros dones son dados por gracia, para el beneficio del cuerpo."}, {"t": "s", "ref": "1 Pedro 4:10", "v": "Cada uno según el don que ha recibido, adminístrelo á los otros, como buenos dispensadores de las diferentes gracias de Dios."}, {"t": "h", "x": "Parte 4: repaso de los dones espirituales"}, {"t": "mygifts"}, {"t": "giftlist"}, {"t": "s", "ref": "1 Corintios 12:4-27", "v": "4 Empero hay repartimiento de dones; mas el mismo Espíritu es. 5 Y hay repartimiento de ministerios; mas el mismo Señor es. 6 Y hay repartimiento de operaciones; mas el mismo Dios es el que obra todas las cosas en todos. 7 Empero á cada uno le es dada manifestación del Espíritu para provecho. 8 Porque á la verdad, á éste es dada por el Espíritu palabra de sabiduría; á otro, palabra de ciencia según el mismo Espíritu; 9 A otro, fe por el mismo Espíritu; y á otro, dones de sanidades por el mismo Espíritu; 10 A otro, operaciones de milagros; y á otro, profecía; y á otro, discreción de espíritus; y á otro, géneros de lenguas; y á otro, interpretación de lenguas. 11 Mas todas estas cosas obra uno y el mismo Espíritu, repartiendo particularmente á cada uno como quiere. 12 Porque de la manera que el cuerpo es uno, y tiene muchos miembros, empero todos los miembros del cuerpo, siendo muchos, son un cuerpo, así también Cristo. 13 Porque por un Espíritu somos todos bautizados en un cuerpo, ora Judíos ó Griegos, ora siervos ó libres; y todos hemos bebido de un mismo Espíritu. 14 Pues ni tampoco el cuerpo es un miembro, sino muchos. 15 Si dijere el pie: Porque no soy mano, no soy del cuerpo: ¿por eso no será del cuerpo? 16 Y si dijere la oreja: Porque no soy ojo, no soy del cuerpo: ¿por eso no será del cuerpo? 17 Si todo el cuerpo fuese ojo, ¿dónde estaría el oído? Si todo fuese oído, ¿dónde estaría el olfato? 18 Mas ahora Dios ha colocado los miembros cada uno de ellos en el cuerpo, como quiso. 19 Que si todos fueran un miembro, ¿dónde estuviera el cuerpo? 20 Mas ahora muchos miembros son á la verdad, empero un cuerpo. 21 Ni el ojo puede decir á la mano: No te he menester: ni asimismo la cabeza á los pies: No tengo necesidad de vosotros. 22 Antes, mucho más los miembros del cuerpo que parecen más flacos, son necesarios; 23 Y á aquellos del cuerpo que estimamos ser más viles, á éstos vestimos más honrosamente; y los que en nosotros son menos honestos, tienen más compostura. 24 Porque los que en nosotros son más honestos, no tienen necesidad: mas Dios ordenó el cuerpo, dando más abundante honor al que le faltaba; 25 Para que no haya desavenencia en el cuerpo, sino que los miembros todos se interesen los unos por los otros. 26 Por manera que si un miembro padece, todos los miembros á una se duelen; y si un miembro es honrado, todos los miembros á una se gozan. 27 Pues vosotros sois el cuerpo de Cristo, y miembros en parte."}, {"t": "h", "x": "Parte 5: mi historia con Jesús"}, {"t": "t", "x": "Contar historias es parte esencial de ARISE Miami. Nadie puede refutar tu historia, y es una herramienta poderosa de evangelismo."}, {"t": "reflect", "x": "¿Cómo era tu vida antes de Jesús?"}, {"t": "reflect", "x": "¿Cómo llegaste a conocer a Jesús?"}, {"t": "reflect", "x": "¿Cómo es tu vida desde entonces?"}, {"t": "h", "x": "Parte 6: la historia de ARISE"}, {"t": "t", "x": "ARISE nació de la fusión de dos iglesias separadas por una generación — New Community e Ignite Fellowship — comprometidas a seguir siendo eficaces en un mundo cambiante."}, {"t": "t", "x": "Valores centrales: Jesús y su Palabra. Aceptación. Innovación. Servicio. Alcanzar a la próxima generación. Formar hacedores de discípulos."}, {"t": "t", "x": "Lema: Lo que sea necesario. Mientras no sea ilegal, inmoral ni engorde, lo intentamos."}, {"t": "h", "x": "Parte 7: repaso"}, {"t": "t", "x": "Tu historia, la historia de Jesús y la historia de ARISE se están cruzando. Tienes un llamado único e irreemplazable."}]}, {"n": 4, "title": "Descubre tu impacto", "sub": "Familia, iglesia, ciudad", "sab": "Cuarto sábado", "icon": "target", "blocks": [{"t": "h", "x": "Parte 1: la iglesia en misión"}, {"t": "t", "x": "Repaso: ¿cuál es la misión a la que Dios nos ha llamado? ¿Cómo definimos a un discípulo? ¿Qué descubriste sobre tus dones?"}, {"t": "h", "x": "Parte 2: plenamente comprometido en ARISE Miami"}, {"t": "t", "x": "Adorar juntos — el culto del sábado, los eventos de toda la iglesia y las reuniones de grupos medianos."}, {"t": "t", "x": "Conectarse profundamente — El Camino, el bautismo, los Grupos de Vida y Base Camp."}, {"t": "t", "x": "Dar con compromiso — tiempo, talento y recursos."}, {"t": "t", "x": "Servir con generosidad — formando parte de un equipo de ministerio."}, {"t": "t", "x": "Servir a Miami — la iglesia local, las misiones y las personas necesitadas."}, {"t": "t", "x": "Estas son las rampas de entrada para crecer en relación con Dios y con las personas, madurando como discípulos de Jesús."}, {"t": "h", "x": "Parte 3: Pacto de Compañerismo de ARISE Miami"}, {"t": "covenant"}, {"t": "h", "x": "Parte 4: siguientes pasos"}, {"t": "t", "x": "Ser miembro de ARISE Miami no se trata de añadir tu nombre a una lista — se trata de conectarte con las personas y con la visión de la iglesia."}, {"t": "ministry"}]}], "GIFTS": [["evangelism", "Evangelismo", "Una capacidad y un entusiasmo especiales para comunicar las buenas nuevas de salvación en Cristo a quienes aún no creen.", "Hechos 8:4-8"], ["prophecy", "Profecía", "La capacidad especial de recibir y comunicar un mensaje oportuno de Dios a una persona o a un grupo.", "Hechos 27:21-26"], ["teaching", "Enseñanza / Predicación", "La capacidad de comprender las verdades espirituales y explicarlas con claridad a otros.", "Hechos 20:20"], ["exhortation", "Exhortación / Ánimo", "El don de ofrecer consuelo, consolación y ánimo a quienes están desanimados, confundidos o vacilantes en su fe.", "Hechos 11:22-24"], ["shepherding", "Pastoreo", "La capacidad dada por Dios de cuidar las necesidades espirituales de un grupo de creyentes y guiarlos a crecer en su fe.", "1 Pedro 5:1-4"], ["serving", "Servicio / Ayuda", "El don de aportar valor espiritual al cumplimiento de las tareas, trabajando junto a otros y liberándolos para usar sus propios dones.", "Hechos 9:36"], ["mercy_showing", "Misericordia", "El don de sentir empatía y compasión por quienes sufren, con un fuerte deseo de servirles y aliviar su dolor.", "Hechos 16:33"], ["giving", "Generosidad", "Un amor dado por Dios por compartir los recursos que uno tiene, sean muchos o pocos, para el beneficio del cuerpo de Cristo.", "Lucas 21:1-4"], ["administration", "Administración", "La capacidad especial de comprender metas inmediatas y a largo plazo, y de organizar personas, información y materiales para alcanzarlas.", "Hechos 6:2-7"]], "MIN": [["Siguientes Pasos", "Ayudar a las personas a dar su próximo paso y encontrar dónde pertenecen.", ["Recibir a los visitantes", "Seguimiento y conexión", "Misiones y alcance", "Servicio comunitario"], ["eva function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);
 for(let j=0;j<=b.length;j++)m[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
  m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return m[a.length][b.length];}

function ministryHTML(){
  // Rank by how many of their gifts a team draws on, but never let a
  // gift disappear: fill slots so every gift is represented first,
  // then spend anything left over on the strongest remaining match.
  const scored = MIN.map(m=>({m, hit:m[3].filter(g=>S.gifts.includes(g))}))
                    .filter(x=>x.hit.length)
                    .sort((a,b)=>b.hit.length-a.hit.length);
  const rec=[], covered=new Set(), pool=[...scored];
  const take=x=>{rec.push(x); x.hit.forEach(g=>covered.add(g));
                 pool.splice(pool.indexOf(x),1);};
  if(pool.length) take(pool[0]);
  while(pool.length && covered.size < S.gifts.length){
    const need = pool.find(x=>x.hit.some(g=>!covered.has(g)));
    if(!need) break;
    take(need);
  }
  while(pool.length && rec.length<3) take(pool[0]);
  rec.sort((a,b)=>b.hit.length-a.hit.length);
  const recNames = new Set(rec.map(x=>x.m[0]));
  const label = g=>{const G=GIFTS.find(x=>x[0]===g); return G?G[1]:g;};

  const cardFor=(m,why)=>{
    const on=S.mins.has(m[0])||m[2].some(r=>S.roles.has(r));
    return `<div class="mcard ${on?'on':''} ${m[2].some(r=>S.roles.has(r))?'open':''}" data-m="${esc(m[0])}">
      <div class="hd"><span class="cb ${S.mins.has(m[0])?'on':''}" data-mm="${esc(m[0])}"></span>
      <span class="nm">${esc(m[0])}</span></div>
      <div class="bl">${esc(m[1])}</div>
      ${why?`<div class="why">Encaja con tu ${esc(why)}</div>`:''}
      <button class="btn ghost tg" style="margin:9px 0 0;padding:7px;font-size:11px">${m[2].some(r=>S.roles.has(r))?'Ocultar roles':'Roles específicos'}</button>
      <div class="roles">${m[2].map(r=>`<div class="rrow" data-r="${esc(r)}">
        <span class="cb ${S.roles.has(r)?'on':''}"></span>${esc(r)}</div>`).join('')}</div></div>`;};

  return `${rec.length?`<div class="box hi"><h3>Recomendado para ti</h3>
    <p>Tu evaluación puso <b>${S.gifts.map(label).map(esc).join('</b>, <b>')}</b> en los primeros lugares. Estos equipos se apoyan más en esos dones.</p>
    <div style="margin-top:13px">${rec.map(x=>cardFor(x.m, x.hit.map(label).join(' and '))).join('')}</div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:4px">Tus tres dones están representados arriba. Es una sugerencia, no un límite — todos los equipos están abiertos para ti.</p>
    </div>`:''}
   <div class="box"><h3>${rec.length?'Todos los ministerios':'¿Dónde vas a servir?'}</h3>
   <p style="font-size:13px">${rec.length?'La lista completa, incluyendo los tres de arriba.':'Elige un equipo, o ábrelo para escoger un rol específico.'}</p>
   <div style="margin-top:13px">${MIN.map(m=>cardFor(m, null)).join('')}</div>
   <div class="opt ${S.mins.has('__unsure')?'on':''}" data-mm="__unsure" style="margin-top:12px">
     <span class="rd"></span><span>Todavía no estoy seguro, pero quiero servir.</span></div>
   </div>`;
}

// Covenant celebration: a confetti burst from both bottom corners, then
// confetti keeps raining from the top for ~9s before fading (~10.5s total).
// Self-contained canvas, removed when done. Skipped for reduced motion.
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas'),dpr=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  cv.width=W*dpr;cv.height=H*dpr;document.body.appendChild(cv);
  const x=cv.getContext('2d');x.scale(dpr,dpr);
  const col=['#12A5B8','#4CAF7D','#F2C14E','#0B2340','#E8604C','#FFFFFF'];
  const RAIN=9000,END=10500,ps=[];let n=0;
  const piece=(px,py,vx,vy)=>({x:px,y:py,vx,vy,w:6+Math.random()*6,h:8+Math.random()*8,
    r:Math.random()*6,vr:Math.random()*.3-.15,sw:Math.random()*6,c:col[n++%col.length],sh:Math.random()<.3});
  for(let i=0;i<170;i++){const left=i%2===0,a=((left?-60:-120)+(Math.random()*40-20))*Math.PI/180,s=9+Math.random()*9;
    ps.push(piece(left?0:W,H,Math.cos(a)*s,Math.sin(a)*s));}
  const t0=performance.now();let last=t0;
  (function frame(t){const k=t-t0,dt=Math.min(t-last,50);last=t;x.clearRect(0,0,W,H);
    if(k<RAIN){const m=Math.round(dt*.09*(W/400));for(let i=0;i<m;i++)
      ps.push(piece(Math.random()*W,-12,Math.random()*2-1,2+Math.random()*2));}
    const fade=k>RAIN+200?Math.max(0,1-(k-RAIN-200)/(END-RAIN-200)):1;
    for(let i=ps.length-1;i>=0;i--){const p=ps[i];
      p.vy=Math.min(p.vy+.28,4.5);p.vx*=.985;p.sw+=.05;p.x+=p.vx+Math.sin(p.sw)*.6;p.y+=p.vy;p.r+=p.vr;
      if(p.y>H+20){ps.splice(i,1);continue;}
      x.save();x.globalAlpha=fade;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.c==='#FFFFFF'){x.strokeStyle='#C9D6DB';x.lineWidth=.8;}
      if(p.sh){x.beginPath();x.arc(0,0,p.w/2,0,7);x.fill();if(p.c==='#FFFFFF')x.stroke();}
      else{x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))+1);}
      x.restore();}
    if(k<END)requestAnimationFrame(frame);else cv.remove();})(t0);
}

function sig(){
  const c=document.getElementById('sig');if(!c)return;
  const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;
  const x=c.getContext('2d');x.scale(2,2);x.lineWidth=2.4;x.lineCap='round';x.strokeStyle='#0B2340';
  let draw=false,any=S.signed;
  const pos=e=>{const b=c.getBoundingClientRect();const p=e.touches?e.touches[0]:e;
    return[p.clientX-b.left,p.clientY-b.top];};
  const start=e=>{e.preventDefault();draw=true;any=true;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b);};
  const move=e=>{if(!draw)return;e.preventDefault();const[a,b]=pos(e);x.lineTo(a,b);x.stroke();};
  const end=()=>{draw=false;};
  c.onmousedown=start;c.onmousemove=move;window.addEventListener('mouseup',end);
  c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end;
  const cl=document.getElementById('clr');
  if(cl)cl.onclick=()=>{x.clearRect(0,0,c.width,c.height);any=false;S.signed=false;c.classList.remove('has');
    const s=document.getElementById('sgn');s.disabled=false;s.textContent='Me comprometo';paint(S.cur);};
  const sg=document.getElementById('sgn');
  if(sg)sg.onclick=()=>{if(!any){alert('Por favor firma en el recuadro de arriba.');return;}
    S.signed=true;c.classList.add('has');sg.disabled=true;sg.textContent='Firmado';paint(S.cur);confetti();};
}

function check(n,inp){
  const sl=inp.parentElement,bx=sl.closest('.blk.f'),
   bi=+sl.dataset.b,si=+sl.dataset.s,k=n+':'+bi+':'+si;
  if(S.slots[k])return;
  const nt=bx.querySelector('.fn'),ans=lv(n).blocks[bi].a[si];
  if(okAns(inp.value,ans)){
    S.slots[k]='ok';sl.classList.remove('bad');sl.classList.add('ok');
    inp.value=ans[0].replace(/^./,c=>c.toUpperCase());inp.readOnly=true;
    nt.className='fn';nt.textContent='';
  }else{
    S.tries[k]=(S.tries[k]||0)+1;
    sl.classList.remove('bad');void sl.offsetWidth;sl.classList.add('bad');
    if(S.tries[k]>=3){S.slots[k]='rev';sl.classList.remove('bad');sl.classList.add('rev');
      inp.value=ans[0].replace(/^./,c=>c.toUpperCase());inp.readOnly=true;
      nt.className='fn rev';nt.textContent='Respuesta mostrada — pregúntale a tu facilitador sobre esta.';
    }else{const lft=3-S.tries[k];nt.className='fn err';
      nt.textContent='Casi. Te '+(lft===1?'queda 1 intento':'quedan '+lft+' intentos')+'.';}
  }
  if([...bx.querySelectorAll('.slot')].every(x=>S.slots[n+':'+x.dataset.b+':'+x.dataset.s]))
    bx.classList.add('solved');
  paint(n);
}

   <div class="cn" id="cn">El código de hoy está en la última diapositiva — pregúntale a tu facilitador.</div>

   <div style="width:72px;height:72px;border-radius:50%;background:#4CAF7D;margin:12px auto 0;display:grid;place-items:center">
   <svg viewBox="0 0 24 24" width="35" height="35" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg></div>
   <h2 style="margin-top:19px">${n===4?'El Camino completado':'Nivel '+n+' completado'}</h2><div class="rule"></div>
   ${n===1&&(S.baptism==='yes'||S.baptism==='talk')?
     `<div class="note" style="text-align:left;margin-bottom:14px">Se le ha informado al pastor Kendall sobre tu decisión respecto al bautismo. Alguien se comunicará contigo esta semana.</div>`:''}
   ${n===4?`<p>Has recorrido los cuatro niveles, firmado el pacto y elegido dónde servir.</p>
     ${picks.length?`<div class="note" style="text-align:left;margin-top:13px;background:#EDF8F2;border-color:#BFE6D3;color:#2E7D55">
       <b>${esc(picks.join(', '))}</b> — se le ha notificado al líder y se comunicará contigo dentro de tres días.</div>`:''}
     <p style="margin-top:14px">Tu camino apenas comienza. Vive con propósito y con poder.</p>`
    :`<p><b style="color:#0B2340">Siguiente: ${esc(nxt)}</b></p>`}
   <button class="btn" id="hm">Volver a El Camino</button></div>`;
  document.getElementById('hm').onclick=home;
  sc.scrollTop=0;
}
back.onclick=()=>S.view==='lesson'?home():lesson(S.cur);
home();
</script></body></html>
